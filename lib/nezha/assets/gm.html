<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>GM 管理後台｜神明Q仙傳</title>
<style>
:root{color-scheme:dark;--ink:#fff2dc;--dim:#b9cecd;--line:#496264;--bg:#122228;--row:#1c3238;--accent:#ffd080}
*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--bg);font:16px system-ui,sans-serif}[hidden]{display:none!important}
main{max-width:1100px;margin:auto;padding:18px}h1{margin:0;font-size:24px}h2{font-size:19px;margin:16px 0 10px}
header,nav,.controls,.pagination,.row-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
header{justify-content:space-between;padding-bottom:16px;border-bottom:1px solid var(--line)}nav{margin-top:14px}
button,input,select{font:inherit;border:1px solid var(--line);border-radius:4px;padding:8px 10px;color:inherit;background:#172c32;min-height:40px}
button{cursor:pointer;font-weight:650}button:hover:enabled{background:#2b474b}button:disabled{opacity:.55;cursor:default}
button[aria-current],.primary{color:#291d19;background:var(--accent);border-color:var(--accent)}
button[aria-current]:hover,.primary:hover:enabled{background:#ffe1a2}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input{min-width:0}.controls label{min-width:0;flex:0 1 270px}.controls input{width:100%}
#login{max-width:380px;margin:32px auto}#login label{display:grid;gap:6px;margin:12px 0}
[role=status]{min-height:22px;color:var(--dim);margin:8px 0}
.table{overflow:auto;border:1px solid var(--line);border-radius:4px}table{border-collapse:collapse;width:100%;min-width:590px;text-align:left}
th,td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}th{background:#223c41;font-size:14px}tr:last-child td{border-bottom:0}
tbody tr:nth-child(even){background:var(--row)}td{overflow-wrap:anywhere}td:nth-child(2){max-width:350px;white-space:pre-wrap}td:last-child{width:225px}
small{display:block;color:var(--dim);margin-top:3px}.row-actions button{font-size:13px;min-height:34px;padding:5px 8px}.pagination{margin:14px 0}
.nickname-history{margin-top:5px;font-size:13px}.nickname-history summary{cursor:pointer}.nickname-history ul{padding-inline-start:1.15rem;margin:4px 0}
.danger{color:#ffc8be;border-color:#985b55}
dialog{width:min(390px,calc(100% - 24px));max-height:85svh;overflow:auto;padding:16px;border:1px solid var(--line);border-radius:6px;background:var(--row);color:var(--ink)}
dialog::backdrop{background:#091417b8}dialog h2{margin:0 0 5px}dialog label{display:grid;gap:6px;margin-top:12px}
#banner-dialog{width:min(520px,calc(100% - 24px))}.banner-preview{display:block;width:124px;aspect-ratio:1140/820;object-fit:contain;background:#122228;border:1px solid var(--line);border-radius:4px}.banner-fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:500px){main{padding:12px}h1{font-size:20px}.controls label{flex-basis:200px}}
</style>
<main>
  <header><h1>神明Q仙傳 GM 後台</h1><button id="logout" type="button" hidden>登出</button></header>
  <form id="login" hidden>
    <h2>GM 登入</h2>
    <label>GM 帳號<input type="text" id="gm-username" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="24" required></label>
    <label>登入金鑰<input type="password" id="password" autocomplete="current-password" maxlength="256" required></label>
    <button type="submit" class="primary">登入</button>
    <p id="login-status" role="status"></p>
  </form>
  <section id="dashboard" hidden>
    <nav aria-label="管理項目"></nav>
    <h2 id="section-name"></h2>
    <form id="search" class="controls">
      <label><input type="search" id="query" maxlength="80" aria-label="搜尋關鍵字" placeholder="搜尋關鍵字"></label>
      <button type="submit">搜尋</button><button type="button" id="reload">重新整理</button>
      <button type="button" id="banner-add" class="primary" hidden>新增橫幅</button>
    </form>
    <p id="status" role="status"></p>
    <div class="table" tabindex="0" aria-labelledby="section-name"><table><thead></thead><tbody></tbody></table></div>
    <div class="pagination"><button id="prev" type="button">上一頁</button><span id="page-number"></span><button id="next" type="button">下一頁</button></div>
  </section>
</main>
<dialog id="action-dialog" aria-labelledby="action-title">
  <form id="action-form">
    <h2 id="action-title"></h2><small id="action-account"></small>
    <div id="action-fields"></div><p id="action-status" role="status"></p>
    <div class="controls"><button id="action-cancel" type="button">取消</button><button id="action-save" type="submit" class="primary">確認</button></div>
  </form>
</dialog>
<dialog id="banner-dialog" aria-labelledby="banner-heading">
  <form id="banner-form">
    <h2 id="banner-heading"></h2>
    <label>標題<input id="banner-title" required maxlength="70"></label>
    <div class="banner-fields">
      <label>分類<select id="banner-kind"><option value="ad">廣告</option><option value="notice">公告</option></select></label>
      <label>排序（小到大）<input id="banner-order" type="number" min="0" max="999" required></label>
    </div>
    <label>點擊連結（HTTPS）<input id="banner-url" type="url" required maxlength="1024"></label>
    <label>橫幅圖片<input id="banner-file" type="file" accept="image/png,image/jpeg,image/webp" aria-describedby="banner-formats"></label>
    <small id="banner-formats">寬 1140 px、高 820 px 以內，檔案不超過 2 MB。支援 PNG、JPG、WebP，不限比例。</small>
    <img id="banner-current" class="banner-preview" alt="目前的橫幅" hidden>
    <p id="banner-status" role="status"></p>
    <div class="controls"><button type="button" id="banner-cancel">取消</button><button type="submit" id="banner-save" class="primary">儲存</button></div>
  </form>
</dialog>
<script>
const byId=id=>document.getElementById(id);
const login=byId('login'),logout=byId('logout'),dashboard=byId('dashboard'),status=byId('status');
const nav=dashboard.querySelector('nav'),body=document.querySelector('tbody'),head=document.querySelector('thead');
const query=byId('query'),prev=byId('prev'),next=byId('next');
const actionDialog=byId('action-dialog'),actionForm=byId('action-form');
const actionSave=byId('action-save'),actionCancel=byId('action-cancel');
const bannerDialog=byId('banner-dialog'),bannerForm=byId('banner-form'),bannerFile=byId('banner-file');
const bannerSave=byId('banner-save'),bannerCancel=byId('banner-cancel'),bannerStatus=byId('banner-status');
const formatter=new Intl.DateTimeFormat('zh-TW',{dateStyle:'short',timeStyle:'short'});
const muteOptions=[[10,'10 分鐘'],[60,'1 小時'],[1440,'24 小時'],[10080,'7 天']];
const views={
  chat:{name:'聊天紀錄',columns:['玩家','訊息','狀態','處理']},
  reports:{name:'密語檢舉',columns:['發送者／檢舉人','被檢舉訊息','處理紀錄','操作']},
  comments:{name:'排行榜留言',columns:['玩家','留言','狀態','處理']},
  accounts:{name:'玩家帳號',columns:['玩家','遊戲紀錄','狀態','處理']},
  billboard:{name:'廟埕布告欄',columns:['橫幅','標題與連結','刊登狀態','操作']}
};
const reportReasons={harassment:'騷擾或辱罵',spam:'洗版或可疑廣告',other:'其他'};
let section='chat',page=1,term='',signedIn=false,revision=0;
async function request(route,data){
  const options=data?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}:{};
  const response=await fetch('/games/nezha/gm/api/'+route,options);
  if(response.status===401&&route!=='login')showLogin();
  const result=await response.json();
  if(!response.ok)throw new Error(result.error||'操作失敗。');
  return result;
}
function showLogin(message=''){
  signedIn=false;revision++;dashboard.hidden=logout.hidden=true;login.hidden=false;
  if(actionDialog.open)actionDialog.close();
  if(bannerDialog.open)bannerDialog.close();
  body.replaceChildren();byId('password').value='';byId('login-status').textContent=message;
}
function showDashboard(){signedIn=true;login.hidden=true;dashboard.hidden=logout.hidden=false;void load();}
function addCell(row,value,extra){
  const cell=row.insertCell();cell.textContent=value;
  if(extra){const detail=document.createElement('small');detail.textContent=extra;cell.append(detail);}
  return cell;
}
actionCancel.onclick=()=>actionDialog.close();
actionDialog.addEventListener('cancel',event=>{if(actionSave.disabled)event.preventDefault();});
function editPlayer(title,account,field,submit){
  byId('action-title').textContent=title;byId('action-account').textContent=account.username;
  byId('action-status').textContent='';
  const label=document.createElement('label');
  let control;
  if(field==='minutes'){
    label.textContent='禁言時間';control=document.createElement('select');
    for(const [duration,name] of muteOptions){const option=document.createElement('option');option.value=duration;option.textContent=name;control.append(option);}
    control.value='60';
  }else{
    label.textContent='新暱稱';control=document.createElement('input');control.maxLength=32;control.required=true;control.value=account.nickname??'';
  }
  label.append(control);byId('action-fields').replaceChildren(label);
  actionForm.onsubmit=async event=>{
    event.preventDefault();actionSave.disabled=actionCancel.disabled=true;
    try{
      await submit({[field]:field==='minutes'?Number(control.value):control.value});
      actionDialog.close();
    }catch(error){byId('action-status').textContent=error.message;}
    finally{actionSave.disabled=actionCancel.disabled=false;}
  };
  actionDialog.showModal();control.focus();
}
function offer(to,id,action,label,{route=section,confirmText,extra,field,account,danger=false}={}){
  const currentView=section;
  const button=document.createElement('button');button.type='button';button.textContent=label;
  if(danger)button.className='danger';
  const submit=async payload=>{
    await request(route,{id,action,...extra,...payload});
    if(signedIn&&section===currentView)await load('已完成「'+label+'」。');
  };
  button.onclick=async()=>{
    if(field){editPlayer(label,account,field,submit);return;}
    if(confirmText&&!window.confirm(confirmText))return;
    for(const item of to.children)item.disabled=true;
    try{
      await submit();
    }catch(error){if(signedIn)status.textContent=error.message;}
    finally{for(const item of to.children)item.disabled=false;}
  };
  to.append(button);
}
const isMuted=account=>account.chatMutedUntil&&Date.parse(account.chatMutedUntil)>Date.now();
const muteStatus=account=>isMuted(account)?'禁言至 '+formatter.format(new Date(account.chatMutedUntil)):null;
function offerMute(actions,account){
  if(isMuted(account))offer(actions,account.id,'unmute','解除禁言',{route:'accounts'});
  else offer(actions,account.id,'mute','禁言',{route:'accounts',field:'minutes',account});
}
function drawNicknameHistory(cell,changes){
  if(!changes.length)return;
  const details=document.createElement('details'),summary=document.createElement('summary'),list=document.createElement('ul');
  details.className='nickname-history';
  summary.textContent='最近改名紀錄';
  for(const change of changes){
    const item=document.createElement('li');
    item.textContent=(change.previousNickname??'未設定')+' → '+change.nickname;
    const date=document.createElement('small');
    date.textContent=(change.changedBy==='gm'?'GM 代改':'玩家自行修改')+' · '+formatter.format(new Date(change.createdAt));
    item.append(date);list.append(item);
  }
  details.append(summary,list);cell.append(details);
}
bannerCancel.onclick=()=>bannerDialog.close();
bannerDialog.addEventListener('cancel',event=>{if(bannerSave.disabled)event.preventDefault();});
function editBanner(item){
  bannerForm.reset();bannerStatus.textContent='';
  byId('banner-heading').textContent=item?'編輯橫幅':'新增橫幅';
  byId('banner-title').value=item?.title??'';byId('banner-kind').value=item?.kind??'ad';
  byId('banner-order').value=item?.sortOrder??10;byId('banner-url').value=item?.targetUrl??'';
  const image=byId('banner-current');image.hidden=!item?.imageUrl;
  if(item?.imageUrl)image.src=item.imageUrl;else image.removeAttribute('src');
  bannerFile.required=!item;
  bannerForm.onsubmit=async event=>{
    event.preventDefault();bannerSave.disabled=bannerCancel.disabled=true;bannerStatus.textContent='';
    try{
      const file=bannerFile.files[0];
      if(file?.size>2*1024*1024)throw new Error('圖片大小不得超過 2 MB。');
      const image=file?await new Promise((resolve,reject)=>{
        const reader=new FileReader();reader.onload=()=>resolve(String(reader.result).split(',')[1]);
        reader.onerror=()=>reject(new Error('無法讀取圖片。'));reader.readAsDataURL(file);
      }):undefined;
      await request('billboard',{action:'save',id:item?.id,title:byId('banner-title').value,kind:byId('banner-kind').value,
        sortOrder:byId('banner-order').valueAsNumber,targetUrl:byId('banner-url').value,image});
      bannerDialog.close();
      if(signedIn&&section==='billboard')await load(item?'已儲存橫幅。':'已建立草稿，點「發布」即可上架。');
    }catch(error){bannerStatus.textContent=error.message;}
    finally{bannerSave.disabled=bannerCancel.disabled=false;}
  };
  bannerDialog.showModal();byId('banner-title').focus();
}
byId('banner-add').onclick=()=>editBanner();
function drawBannerRow(row,item){
  const preview=row.insertCell();
  if(item.imageUrl){const image=document.createElement('img');image.src=item.imageUrl;image.alt='';image.className='banner-preview';preview.append(image);}
  addCell(row,item.title,item.targetUrl);
  addCell(row,item.published?'刊登中':'未刊登',(item.kind==='ad'?'廣告':'公告')+' · 排序 '+item.sortOrder);
  const actions=document.createElement('div');actions.className='row-actions';
  const edit=document.createElement('button');edit.type='button';edit.textContent='編輯';edit.onclick=()=>editBanner(item);
  actions.append(edit);
  offer(actions,item.id,item.published?'unpublish':'publish',item.published?'下架':'發布');
  offer(actions,item.id,'delete','刪除',{confirmText:'確定刪除「'+item.title+'」？此操作無法還原。',danger:true});
  row.insertCell().append(actions);
}
function drawRows(rows){
  body.replaceChildren();
  for(const item of rows){
    const row=body.insertRow();
    if(section==='billboard'){drawBannerRow(row,item);continue;}
    const account=item.whisper?.sender??item.account??item;
    const {username,nickname}=account;
    const identity=addCell(row,nickname||'尚未設定暱稱',username);
    const actions=document.createElement('div');actions.className='row-actions';
    if(section==='chat'){
      addCell(row,item.body,formatter.format(new Date(item.createdAt)));
      addCell(row,item.hiddenAt?'已隱藏':'公開',muteStatus(account));
      offer(actions,item.id,item.hiddenAt?'restore':'hide',item.hiddenAt?'還原':'隱藏');
      offer(actions,item.id,'delete','刪除',{confirmText:'確定永久刪除 '+username+' 這則聊天訊息？此操作無法還原。',danger:true});
      offerMute(actions,account);
    }else if(section==='reports'){
      const reporter=document.createElement('small');
      reporter.textContent='檢舉人：'+(item.whisper.recipient.nickname||item.whisper.recipient.username);
      identity.append(reporter);
      addCell(row,item.whisper.body,reportReasons[item.reason]+' · 檢舉於 '+formatter.format(new Date(item.createdAt)));
      addCell(row,item.handledAt?(item.decision==='confirmed'?'已確認違規':'已駁回'):'待處理',
        item.handledAt?formatter.format(new Date(item.handledAt))+' · '+item.handledBy:muteStatus(account));
      if(!item.handledAt){
        offer(actions,item.whisperId,'confirmed','確認違規',{confirmText:'確認這則密語違規？此操作只記錄判定，不會自動禁言。'});
        offer(actions,item.whisperId,'dismissed','駁回檢舉',{confirmText:'確定駁回此檢舉？'});
      }
      offerMute(actions,account);
    }else if(section==='comments'){
      addCell(row,item.message,'無限塔第 '+item.cleared+' 層');
      addCell(row,item.messageHiddenAt?'已隱藏':'公開');
      offer(actions,item.accountId,item.messageHiddenAt?'restore':'hide',item.messageHiddenAt?'還原':'隱藏');
      offer(actions,item.accountId,'delete','刪除留言',{confirmText:'確定刪除 '+username+' 的排行榜留言？只移除文字，名次與成績會保留。',extra:{message:item.message},danger:true});
    }else{
      const cleared=item.score?.cleared??0;
      const earned=Boolean(item.jigongUnlockedAt||cleared>=1);
      drawNicknameHistory(identity,item.nicknameChanges);
      addCell(row,cleared?'無限塔第 '+cleared+' 層':'尚無上榜成績',earned?'濟公：遊戲解鎖':item.jigongGrantedAt?'濟公：GM 開放':'濟公：未解鎖');
      addCell(row,item.suspendedAt?'停用':'正常',muteStatus(item));
      offer(actions,item.id,'rename','修改暱稱',{field:'nickname',account});
      if(item.jigongGrantedAt)offer(actions,item.id,'remove-jigong-grant','收回手動開放',{confirmText:'收回 '+username+' 的 GM 角色開放？玩家自己取得的解鎖資格不受影響。'});
      else if(!earned)offer(actions,item.id,'grant-jigong','開放濟公',{confirmText:'為 '+username+' 開放濟公禪師？'});
      offerMute(actions,item);
      offer(actions,item.id,item.suspendedAt?'restore':'suspend',item.suspendedAt?'恢復帳號':'停用帳號',{confirmText:item.suspendedAt?null:'停用 '+username+'、撤銷登入並解除其隊伍與組隊邀請？'});
      if(!item.suspendedAt)offer(actions,item.id,'revoke','撤銷登入',{confirmText:'讓 '+username+' 從所有裝置登出？'});
    }
    row.insertCell().append(actions);
  }
}
async function load(done=''){
  const version=++revision;
  const view=views[section];
  byId('section-name').textContent=view.name;byId('page-number').textContent='第 '+page+' 頁';
  query.placeholder=section==='accounts'?'帳號、暱稱或舊暱稱':'搜尋關鍵字';
  byId('banner-add').hidden=section!=='billboard';
  for(const button of nav.children){if(button.dataset.view===section)button.setAttribute('aria-current','page');else button.removeAttribute('aria-current');}
  head.replaceChildren();const header=head.insertRow();
  for(const title of view.columns){const col=document.createElement('th');col.scope='col';col.textContent=title;header.append(col);}
  body.replaceChildren();status.textContent='讀取中…';prev.disabled=next.disabled=true;
  try{
    const result=await request(section+'?'+new URLSearchParams({q:term,page:String(page)}));
    if(!signedIn||version!==revision)return;
    drawRows(result.rows);prev.disabled=page<=1;next.disabled=!result.more;
    status.textContent=done||(!result.rows.length?'查無資料。':'');
  }catch(error){if(signedIn&&version===revision)status.textContent=error.message;}
}
for(const [id,view] of Object.entries(views)){
  const button=document.createElement('button');button.type='button';button.dataset.view=id;button.textContent=view.name;
  button.onclick=()=>{section=id;page=1;term=query.value='';void load();};nav.append(button);
}
byId('search').onsubmit=event=>{event.preventDefault();term=query.value.trim();page=1;void load();};
byId('reload').onclick=()=>void load();
prev.onclick=()=>{if(page>1){page--;void load();}};next.onclick=()=>{if(!next.disabled){page++;void load();}};
login.onsubmit=async event=>{
  event.preventDefault();const button=login.querySelector('button');button.disabled=true;
  try{await request('login',{username:byId('gm-username').value,password:byId('password').value});byId('password').value='';showDashboard();}
  catch(error){byId('login-status').textContent=error.message;}
  finally{button.disabled=false;}
};
logout.onclick=async()=>{
  try{await request('logout',{});showLogin();}catch(error){status.textContent=error.message;}
};
request('session').then(({authenticated})=>authenticated?showDashboard():showLogin()).catch(error=>showLogin(error.message));
</script>
</html>
