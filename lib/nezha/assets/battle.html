<!doctype html>
<html lang="zh-Hant" class="playing coop">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>雙人守廟埕｜神明Q仙傳</title>
<link rel="stylesheet" href="/games/nezha/battle-ui.css">
<main>
<header><div><a href="/" style="color:inherit"><small>神明便利貼</small></a><strong>神明Q仙傳</strong></div>
<div class="account"><span id="nickname"></span><button id="updates" type="button" aria-haspopup="dialog">更新日誌</button><button id="logout" type="button">登出</button><button id="pause" type="button" aria-haspopup="dialog">選單</button></div></header>
<div class="field">
<canvas id="arena" aria-label="雙人守廟埕遊戲區"></canvas>
<div class="hud"><dl class="stats" aria-label="玩家角色狀態">
<dt>血量</dt><dd id="health"></dd><dt>攻擊力</dt><dd id="attack"></dd>
<dt>防禦力</dt><dd id="defense"></dd><dt>移動速度</dt><dd id="moveSpeed"></dd></dl><span id="clock"></span><span id="level"></span></div>
<div id="wave" class="wave" hidden></div>
<div class="bossbar" id="bossbar" hidden><span id="bossname"></span><progress id="bossHP" aria-label="魔王血量"></progress></div>
<progress id="xp" aria-label="升級進度"></progress>
<div id="team-status" class="team-status" hidden>
  <span id="team-name"></span><span id="team-health"></span>
  <progress id="team-hp" aria-label="隊友血量"></progress>
</div>
<p id="link-state" class="coop-notice" role="status">連接戰鬥房間中…</p>
<p id="score-status" class="coop-notice" hidden></p>
<div id="upgrade-panel" class="overlay coop-upgrade" hidden>
  <div class="card" aria-labelledby="upgrade-title">
    <h1 id="upgrade-title"></h1><p id="upgrade-detail"></p>
    <div id="upgrade-options" class="actions level-up-actions"></div>
    <button class="close-upgrade" id="upgrade-close" type="button">收起</button>
  </div>
</div>
</div>
<section class="skills" aria-label="氣功、法寶與冷卻時間">
<div class="skill"><strong></strong><small></small><progress max="1" aria-label="基礎氣功冷卻"></progress></div>
<div class="skill"><strong></strong><small></small><progress max="1" aria-label="乾坤圈冷卻"></progress></div>
<div class="skill"><strong></strong><small></small><progress max="1" aria-label="風火輪冷卻"></progress></div>
<div class="skill"><strong></strong><small></small><progress max="1" aria-label="金磚冷卻"></progress></div>
</section>
<div id="gear" aria-label="強化道具"></div>
<footer class="hint"><span class="controls">WASD／方向鍵移動・數字鍵選擇</span><div class="xp-summary">
  <span id="score"></span><button id="spendXP" type="button" aria-controls="upgrade-panel" aria-expanded="false" disabled>升級</button>
</div></footer>
</main>
<dialog id="room-menu" class="card coop-menu" aria-labelledby="room-menu-title">
  <h1 id="room-menu-title">雙人守廟埕</h1><p id="room-menu-status">線上戰鬥不會暫停。</p>
  <div class="actions">
    <button id="continue-room" type="button">1　繼續遊戲</button>
    <button id="leave-room" type="button">2　返回大廳</button>
    <button id="retry" type="button" hidden>重連</button>
    <button id="rank-save" type="button" hidden>重新儲存成績</button>
  </div>
</dialog>
<dialog id="update-log" class="update-log" aria-labelledby="update-title">
  <header><h2 id="update-title">更新日誌</h2><form method="dialog"><button type="submit">關閉</button></form></header>
  <div id="update-entries"></div>
</dialog>
<script src="/games/nezha/battle-rules.js"></script>
<script src="/games/nezha/battle-ui.js"></script>
<script src="/games/nezha/enemy-art.js"></script>
<script src="/games/nezha/battle.js"></script>
</html>
