<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>神明Q仙傳｜神明便利貼</title>
<link rel="preload" as="image" href="/games/nezha/nezha-sheet.png" fetchpriority="high">
<style>
:root{color-scheme:dark;--night:#101d25;--panel:#1c3038;--line:#526668;--ink:#fff3dc;--muted:#ced6c9;--gold:#ffcf77;--red:#d96c52;--mint:#8ad4b5}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--night);color:var(--ink);font:16px system-ui,sans-serif}
html.playing,html.playing body{overflow:hidden;overscroll-behavior:none}
html.playing body{touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
main{height:100vh;height:100svh;max-width:1320px;margin:auto;display:flex;flex-direction:column;padding:16px 22px;gap:10px}
header,footer{display:flex;justify-content:space-between;align-items:center;gap:8px}
header a{text-decoration:none}header small{display:block;color:var(--gold);font-size:12px}
header strong{display:block;white-space:nowrap;font-size:24px}
button{font:inherit;font-weight:800;border:2px solid #141f26;border-radius:4px;background:var(--gold);color:#331e22;padding:8px 13px;cursor:pointer;box-shadow:0 3px #a45d42}
button:hover:enabled{background:#ffe0a1}button:disabled{opacity:.55;cursor:default}
button:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid white;outline-offset:3px}
.account{display:flex;justify-content:flex-end;align-items:center;gap:8px;min-width:0;font-size:14px}
.account button{flex-shrink:0;padding:5px 9px}.account #nickname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
.field{position:relative;overflow:hidden;flex:1;min-height:0;border:2px solid #b78d59;border-radius:4px;background:#34454a;box-shadow:0 0 0 2px #0a151d}
canvas{width:100%;height:100%;display:block;touch-action:none;image-rendering:pixelated}
#arena{position:absolute;inset:0}
#player-sprite{position:absolute;left:0;top:0;width:148px;height:148px;pointer-events:none}
.hud{pointer-events:none;position:absolute;top:12px;inset-inline:12px;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:start;gap:5px;font-weight:800}
.hud span,.stats,.bossbar,.wave{background:#17252ff2;border:1px solid #9d8062;border-radius:2px}
.hud span{padding:6px 10px;font-size:14px;white-space:nowrap}.hud #level{justify-self:end}
.stats{justify-self:start;display:grid;grid-template-columns:auto auto;gap:2px 6px;margin:0;padding:6px 8px;font-size:12px}
.stats dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}.stats dd:first-of-type{color:var(--mint)}
.wave{position:absolute;top:49px;right:12px;padding:4px 6px;color:#ffe4ac;font-size:12px;font-weight:800;pointer-events:none}
.wave-warning{border-color:var(--red);background:#392626;color:var(--ink)}
.bossbar{position:absolute;top:101px;left:50%;transform:translateX(-50%);width:min(320px,82%);text-align:center;padding:5px 10px;font-weight:800;font-size:14px;pointer-events:none}
progress{appearance:none;border:0;border-radius:0;background:#0c1922;color:var(--gold)}
progress::-webkit-progress-bar{background:#0c1922}progress::-webkit-progress-value{background:var(--fill,var(--gold))}
progress::-moz-progress-bar{background:var(--fill,var(--gold))}
.bossbar progress{display:block;width:100%;height:8px;margin-top:4px;--fill:#f07c61}
.field>#xp{position:absolute;left:10px;bottom:10px;width:calc(100% - 20px);height:8px;--fill:var(--mint);pointer-events:none}
.overlay{position:absolute;inset:0;overflow:auto;overscroll-behavior:contain;display:grid;place-items:center;background:#0e1925a6;padding:10px}
.card{width:min(430px,100%);padding:21px;text-align:center;background:#21343b;color:var(--ink);border:2px solid #e5ab65;box-shadow:0 0 0 3px #162126,0 8px #101b22;border-radius:4px;overflow-wrap:anywhere}
.card h1{font-size:29px;line-height:1.15;margin:4px 0 10px;color:var(--gold)}
.card p{line-height:1.5;margin:7px 0 12px;font-size:14px;color:#e3e7d8}
.card .portrait{width:96px;height:96px;margin:auto}
.card .portrait:not([data-loaded]){visibility:hidden}
.actions{display:grid;gap:7px}.actions button{width:100%;text-align:left;padding:7px 10px}
.card:has(.level-up-actions){width:min(660px,100%)}
.level-up-actions{grid-template-columns:repeat(2,minmax(0,1fr))}
.level-up-actions button{min-width:0;min-height:44px;font-size:14px;line-height:1.3}
.skills{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.skill{min-width:0;background:var(--panel);border:1px solid var(--line);border-top:2px solid var(--red);padding:6px 8px}
.skill:first-child{border-top-color:#71d8ff}.skill:nth-child(3){border-top-color:var(--gold)}.skill:nth-child(4){border-top-color:var(--mint)}
.skill:first-child progress{--fill:#71d8ff}
.skill strong,.skill small{display:block;line-height:1.25;overflow-wrap:anywhere}
.skill strong{font-size:14px}.skill small{margin-top:2px;color:var(--muted);font-size:12px}
.skill progress{display:block;width:100%;height:4px;margin-top:4px}
#gear,.hint{font-size:12px;color:var(--muted)}
.hint{flex-wrap:wrap}.hint #score{font-variant-numeric:tabular-nums}
.xp-summary{margin-left:auto;display:flex;align-items:center;justify-content:flex-end;gap:8px;min-width:0}
#spendXP{inline-size:88px;flex-shrink:0;padding:5px 6px;white-space:nowrap}
#spendXP:disabled{visibility:hidden}
.ranking{max-height:25vh;max-height:25svh;overflow:auto;text-align:left;padding-left:28px}
.ranking li{padding:4px;overflow-wrap:anywhere}
.ranking-message{display:block;color:#ffd389;white-space:pre-wrap;font-size:14px}
.ranking-editor{display:grid;gap:6px;margin:10px 0;text-align:left}
.ranking-editor label,.card [role=status]{font-weight:700;font-size:14px}
.ranking-editor textarea{width:100%;min-height:56px;resize:vertical;padding:6px 8px;border:1px solid #a38b66;border-radius:3px;background:#152931;color:var(--ink);font:inherit}
.ranking-editor button{justify-self:start;padding:5px 12px}
html.lobby :is(.hud,.wave,.bossbar,#xp,.skills,#gear,.hint){display:none!important}
html.lobby .overlay{grid-template-rows:minmax(0,1fr)}
.card.lobby-hub{width:min(650px,100%);height:min(550px,100%);display:flex;flex-direction:column;text-align:left}
.lobby-hub>.actions,.lobby-nav{flex:none}
#lobby-tower-start{background:#263c43;color:var(--gold);border-color:#ad8d5e}
.lobby-nav{display:grid;grid-template-columns:repeat(auto-fit,minmax(62px,1fr));gap:5px;margin:12px 0;border-bottom:1px solid var(--line)}
.lobby-nav button{min-width:0;min-height:40px;padding:6px 2px;background:transparent;color:var(--muted);border:0;border-bottom:3px solid transparent;box-shadow:none;font-size:14px}
.lobby-nav button:hover:enabled{background:#29434a;color:var(--ink)}
.lobby-nav button[aria-current]{border-bottom-color:var(--gold);color:var(--gold);background:#263c43}
.lobby-view{flex:1;min-height:0;overflow:auto;padding:2px 0;margin-bottom:12px}
.lobby-view h2{margin:0 0 9px;font-size:19px;color:var(--ink)}
.lobby-view h3{margin:8px 0 0;font-size:14px;color:var(--muted)}
.lobby-view .ranking{margin-bottom:0}
.lobby-hero{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:16px;padding:8px 0}
.lobby-hero h2{margin-bottom:4px}.lobby-hero p{margin:0}
.lobby-hero .run-status{color:var(--gold);font-weight:700}
.lobby-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:7px 0 0}
.lobby-stats div{min-width:0;padding:7px 4px;border-top:1px solid var(--line);background:#152931;text-align:center}
.lobby-stats dt{font-size:12px;color:var(--muted)}.lobby-stats dd{margin:4px 0 0;font-weight:800;font-variant-numeric:tabular-nums}
.character-roster{display:grid;gap:4px;margin-top:8px}.character-choice{border-top:1px solid var(--line)}
.character-choice button{margin-top:7px;font-size:14px}.character-choice .character-art{position:relative}
.character-choice .portrait{width:80px;height:80px}.character-feedback:empty{display:none}
.character-art.is-locked .portrait{filter:brightness(0) opacity(.6)}
.character-art.is-locked::after{content:'?';position:absolute;inset:0;display:grid;place-items:center;color:var(--gold);font-size:31px;font-weight:800}
.update-log{width:min(530px,calc(100% - 26px));max-height:85vh;max-height:85svh;overflow:auto;color:var(--ink);background:#21343b;border:2px solid #e5ab65;border-radius:4px;padding:0 16px 16px;text-align:left}
.update-log::backdrop{background:#0e1925bb}.update-log header{position:sticky;top:0;z-index:1;background:#21343b;padding:12px 0;border-bottom:1px solid var(--line)}
.update-log h2{font-size:21px;margin:0;color:var(--gold)}.update-log h3{font-size:16px;margin:14px 0 4px}.update-log time{color:var(--muted);font-size:13px}
.update-log ul{padding-left:21px;margin:8px 0;font-size:14px;line-height:1.55}.update-log li+li{margin-top:6px}
.unlock-toast{position:absolute;z-index:1;top:18%;left:50%;transform:translateX(-50%);max-width:90%;padding:7px 12px;background:#17252f;color:var(--gold);border:1px solid var(--gold);text-align:center;pointer-events:none;font-size:14px;font-weight:800}
html.lobby .unlock-toast{display:none}
.lobby-view.lobby-chat-view,.lobby-room{display:flex;flex-direction:column}
.lobby-room{flex:1;min-height:0;gap:8px}
.lobby-log{flex:1;min-height:48px;overflow:auto;overscroll-behavior:contain;margin:0;padding:0 12px;list-style:none;background:#152931;border:1px solid var(--line);border-radius:4px}
.lobby-log li{padding:9px 0;border-bottom:1px solid #52666880;overflow-wrap:anywhere}
.lobby-log li:last-child{border-bottom:none}
.lobby-meta{display:flex;align-items:baseline;justify-content:space-between;gap:8px;color:var(--gold);font-size:13px}
.lobby-meta time{flex-shrink:0;color:var(--muted);font-size:12px}
.lobby-log span{display:block;margin-top:3px;line-height:1.45;font-size:14px}
.lobby-form{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:7px}
.lobby-form input{width:100%;min-width:0;border:1px solid var(--line);border-radius:4px;padding:8px;background:#152931;color:var(--ink);font:inherit}
.lobby-form input:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
.lobby-panels{display:flex;flex:1;min-height:0;flex-direction:column}
.lobby-social-rail{margin:0 0 9px;padding:8px;border:1px solid var(--line);border-radius:4px;background:#152931}
.lobby-social-rail h2{font-size:15px;margin:0 0 5px;color:var(--gold)}
.card .lobby-social-rail p{margin:4px 0;font-size:12px;line-height:1.35}
.card .party-member .portrait{width:36px;height:36px}
.party-members{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.party-member{display:flex;align-items:center;gap:4px;min-width:0;overflow-wrap:anywhere}
.party-member .portrait{flex:none}.party-member strong,.party-member small{display:block;font-size:12px}
.social-actions{display:flex;flex-wrap:wrap;gap:6px}
.social-actions button{padding:4px 8px;font-size:13px}
.social-channels{display:flex;flex:none;gap:6px;margin-bottom:6px}
.social-channels button{font-size:13px;padding:5px 8px;background:#152931;color:var(--muted);box-shadow:none}
.social-channels button[aria-pressed=true]{border-color:var(--gold);color:var(--gold)}
.player-action{padding:3px 0;min-width:0;overflow-wrap:anywhere;background:none;color:var(--gold);border:0;box-shadow:none;font:inherit;font-weight:700;text-align:start}
.player-action:hover:enabled{box-shadow:none;text-decoration:underline;background:none;color:var(--gold)}
.social-dialog .actions{margin:10px 0}
.social-list{list-style:none;margin:4px 0 12px;padding:0}
.social-list li{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:5px 10px;padding:7px 0;border-bottom:1px solid var(--line);overflow-wrap:anywhere}
.social-field{display:flex;flex-direction:column;gap:5px;margin-bottom:10px}
.social-release{color:var(--muted);font-size:12px;margin:2px 0}
.social-status:empty{display:none}
.whisper-target button{font-size:12px;padding:2px 7px}
.whisper-report{padding:2px 5px;margin-inline-start:7px;font-size:12px;box-shadow:none;vertical-align:baseline}
.social-dialog select{width:100%;font:inherit;border:1px solid var(--line);border-radius:4px;padding:7px;color:var(--ink);background:#152931}
@media(min-width:850px),(min-width:540px) and (max-height:470px){
  .lobby-panels.with-party{display:grid;grid-template-columns:minmax(0,1fr) 185px;gap:12px}
  .lobby-panels.with-party .lobby-social-rail{align-self:start}
  .lobby-panels.with-party .party-members{grid-template-columns:1fr}
}
@media(max-width:560px){
  .card.lobby-hub:has(.with-party){height:100%}
  .lobby-hub:has(.with-party) .lobby-nav{margin:5px 0}
  .lobby-panels.with-party .lobby-chat-view:has(.social-channels)>h2{
    position:absolute;inline-size:1px;block-size:1px;overflow:hidden;clip-path:inset(50%)
  }
  .lobby-social-rail{margin-bottom:5px;padding:5px}
  .lobby-social-rail h2{margin-bottom:2px;font-size:13px}
  .lobby-social-rail .social-actions button{padding:3px 6px}
  .card .party-member .portrait{width:28px;height:28px}
}
.lobby-room [role=status]:empty{display:none}
@media(max-width:560px){
  main{padding:8px;gap:6px}header strong{font-size:18px}.account{gap:4px;font-size:12px}
  .hud{inset-inline:6px;top:6px;grid-template-columns:minmax(0,max-content) 1fr auto}
  .hud #clock{justify-self:center}.hud span,.stats{padding:4px;font-size:11px}
  .wave{top:35px;right:6px;font-size:10px}.bossbar{top:75px}
  .card{padding:13px}.card h1{font-size:23px}.skill{padding:4px}.skill strong{font-size:12px}
  .level-up-actions{gap:5px}.level-up-actions button{padding:5px 6px;font-size:12px}
  .hint .controls{display:none}
}
@media(max-width:420px){
  .skills{grid-template-columns:repeat(2,minmax(0,1fr));gap:4px}
}
@media(max-height:470px){
  main{padding-block:5px;gap:4px}
  .card{padding:10px}.card h1{font-size:21px;margin:2px 0 5px}
  .card .portrait{width:56px;height:56px}.card p{margin:4px 0 6px}
  .card:has(.tome-actions) .portrait{display:none}
  .tome-actions{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tome-actions button:first-child{grid-column:1/-1}
  #gear,.hint .controls{display:none}
}
@media(min-width:540px) and (max-height:470px){
  .level-up-actions{grid-template-columns:repeat(4,minmax(0,1fr));gap:5px}
  .level-up-actions button{padding:5px 6px;font-size:12px;line-height:1.25}
}
</style>
<main>
<header><div><a href="/" style="color:inherit"><small>神明便利貼</small></a><strong>神明Q仙傳</strong></div><div class="account"><span id="nickname"></span><button id="updates" type="button" aria-haspopup="dialog">更新日誌</button><button id="logout">登出</button><button id="pause" disabled>暫停</button></div></header>
<div class="field">
<canvas id="arena" aria-label="廟埕遊戲區"></canvas>
<canvas id="player-sprite" aria-hidden="true"></canvas>
<div class="hud"><dl class="stats" aria-label="玩家角色狀態">
<dt>血量</dt><dd id="health"></dd><dt>攻擊力</dt><dd id="attack"></dd>
<dt>防禦力</dt><dd id="defense"></dd><dt>移動速度</dt><dd id="moveSpeed"></dd></dl><span id="clock"></span><span id="level"></span></div>
<div id="wave" class="wave" hidden></div>
<div class="bossbar" id="bossbar" hidden><span id="bossname"></span><progress id="bossHP" aria-label="魔王血量"></progress></div>
<progress id="xp" aria-label="升級進度"></progress>
<div id="unlock-toast" class="unlock-toast" role="status" hidden>濟公禪師已解鎖！</div>
<div class="overlay" id="overlay"><div class="card" id="card"></div></div>
</div>
<section class="skills" aria-label="氣功、法寶與冷卻時間">
<div class="skill"><strong></strong><small></small><progress max="1" aria-label="基礎氣功冷卻"></progress></div>
<div class="skill"><strong></strong><small></small><progress max="1" aria-label="乾坤圈冷卻"></progress></div>
<div class="skill"><strong></strong><small></small><progress max="1" aria-label="風火輪冷卻"></progress></div>
<div class="skill"><strong></strong><small></small><progress max="1" aria-label="金磚冷卻"></progress></div>
</section>
<div id="gear" aria-label="強化道具"></div>
<footer class="hint"><span class="controls">WASD／方向鍵移動・數字鍵選擇</span><div class="xp-summary"><span id="score"></span><button id="spendXP" type="button" disabled>升級</button></div></footer>
</main>
<dialog id="update-log" class="update-log" aria-labelledby="update-title">
  <header><h2 id="update-title">更新日誌</h2><form method="dialog"><button type="submit">關閉</button></form></header>
  <div id="update-entries"></div>
</dialog>
<script src="/games/nezha/battle-rules.js"></script>
<script src="/games/nezha/battle-combat.js"></script>
<script src="/games/nezha/enemy-art.js"></script>
<script src="/games/nezha/social.js"></script>
<script>
const canvas = document.querySelector('#arena');
const ctx = canvas.getContext('2d');
const playerSprite=document.querySelector('#player-sprite');
const spriteCtx=playerSprite.getContext('2d');
const unlockToast=document.querySelector('#unlock-toast');
const updateDialog=document.querySelector('#update-log');
const overlay = document.querySelector('#overlay');
const card = document.querySelector('#card');
const pause = document.querySelector('#pause');
const heroSheet = new Image();
const heroSheetUrl = '/games/nezha/nezha-sheet.png';
let heroSheetFailed = false;
const jigongSheet=new Image();
const jigongSheetUrl='/games/nezha/jigong-attack-sheet.png';
let jigongSheetFailed=false;
const heroCellSize = 724;
const heroWorldSize=78;
let spriteDensity=0,spriteRasterKey='',spriteLeft,spriteTop;
// Each body stays centered on the same point, including the wider attack pose.
const heroPoses = {
  idle:{column:0,anchorX:319,anchorY:668},
  fly:{column:1,anchorX:313,anchorY:659},
  attack:{column:2,anchorX:387,anchorY:663}
};
const characterNames={nezha:'三太子',jigong:'濟公禪師'};
const jigongFrame={anchorX:485,anchorY:675};
const characterSheet=id=>id==='jigong'?jigongSheet:heroSheet;
function loadJigongSheet(){if(!jigongSheet.getAttribute('src'))jigongSheet.src=jigongSheetUrl;}
for(const asset of [heroSheet,jigongSheet])asset.addEventListener('load',()=>{
  spriteRasterKey='';
  for(const portrait of card.querySelectorAll('.portrait'))drawHeroPortrait(portrait);
  refreshLobbyPlay();requestFrame();
});
heroSheet.addEventListener('error',()=>{
  heroSheetFailed=true;
  refreshLobbyPlay();
});
jigongSheet.addEventListener('error',()=>{jigongSheetFailed=true;refreshLobbyPlay();});
const keys = new Set();
const rounds = NezhaRules.storyDuration;
const bossXPNoticeTime = 1.2;
const contactHitInterval = 0.5;
const rewardInterval = 6;
const mapWidth = 2880;
const mapHeight = 2160;
const {wheelOrbitRadius,wheelHitRadius,wheelEvolutionScale,wheelKnockbackCooldown,
  bossStages,normalSkillLimit,baseStats,miniTypes,rangedAttacks,patterns,jigongSpecs,skillNames,
  ringCooldown,ringExplosionLife,brickCooldown,wheelCooldown,jigongWindRadius,
  maxMoveSpeed,attackGainPerLevel,defenseGainPerLevel,milestoneLevels}=NezhaRules;
const tileWidth = 48;
const pickupRadius = 2 * tileWidth;
const bombKillLimit = 20;
const bombFlashTime = .4;
const magnetFlightTime = .9;
const magnetPulseTime = .55;
const maxMagnetFlights = 180;
const skillTomeChance=.005;
const {towerBaselineFloor,towerFloorGrowth,towerHealthBoost,towerDamageBoost,towerGuardians,towerGoal,storyWaves}=NezhaRules;
const storyMobLimit=80;
const waveWarningTime=4;
const projectilePlayerRadius=12;
const towerStartLevel=50,towerStartUpgrades=50,towerStartRewards=25;
let towerFloor, floorKills, floorTime, towerTime, clearedFloors, towerBaseline;
let optionButtons=[];
const miniBossChance=.30;
let nextWave, waveSlots, miniBossKills, miniBossThreshold, gearRewards, nextRewardAt;
const skillCombat=NezhaCombat.create(NezhaRules);
let boss, nextBoss, elapsed, warnings, drops, wheelTrail, trailTimer;
let enemyShots, nextEnemyAimAt;
let magnetEffect;
const camera={x:0,y:0};
const view={x:0,y:0,width:0,height:0};
const minViewZoom=.65,maxViewZoom=1.6;
let viewZoom=1;
let width, height, player, mobs, stars, sparks, time, spawn, kills, mode;
let stick=null,pinch=null;
let closeLobby = null;
let runInProgress=false,lobbyDraft='';
let profile={character:'nezha',jigongUnlocked:false,jigongEarned:false,towerStartUnlocked:false};
let unlockRun=null,towerEntryPending=false,unlockRequest=null,checkpointRun=null,checkpointRequest=null;
let unlockToastUntil=0;
let characterRefresh=null,selectingCharacter=false,startingRun=false;
const clamp = (n,min,max) => Math.max(min,Math.min(max,n));
const distance = (a,b) => Math.hypot(a.x-b.x,a.y-b.y);
const unit = (x,y) => {const length = Math.hypot(x,y) || 1; return [x/length,y/length];};
function resize(){
  const density=Math.min(4,window.devicePixelRatio||1);
  if(spriteDensity!==density){
    spriteDensity=density;

function handleArenaTouch(event){
  if(mode!=='play')return;
  if(event.cancelable)event.preventDefault();
  const touches=event.targetTouches;
  if(event.type==='touchcancel'||!touches.length){
    if(stick?.pointerType==='touch')releaseStick();
    if(!touches.length)pinch=null;
    else if(pinch)pinch.span=0;
    return;
  }
  if(touches.length>=2){
    releaseStick();
    const a=touches[0],b=touches[1];
    const span=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);
    if(!pinch?.span||!pinch.ids.includes(a.identifier)||!pinch.ids.includes(b.identifier)){
      pinch={ids:[a.identifier,b.identifier],span:Math.max(1,span),zoom:viewZoom};

      const zoom=clamp(pinch.zoom*span/pinch.span,minViewZoom,maxViewZoom);

    }
    return;
  }
  // The remaining finger must lift before it can become a new joystick.
  if(pinch){pinch.span=0;return;}
  const touch=touches[0];
  if(!stick&&event.type==='touchstart')grabStick(touch.identifier,'touch',touch.clientX,touch.clientY);
  else if(stick?.pointerType==='touch'&&stick.id===touch.identifier)moveStick(touch.clientX,touch.clientY);

function healEnemyAllies(enemy,allies){
  if(elapsed<enemy.abilityAt)return;
  enemy.abilityAt=elapsed+4;
  let healed=0;
  for(const ally of allies){
    if(ally===enemy||ally===boss||ally.hp<=0||ally.hp>=ally.maxHp||distance(enemy,ally)>105)continue;
    ally.hp=Math.min(ally.maxHp,ally.hp+Math.ceil(ally.maxHp*.10));
    ally.healFlashUntil=elapsed+.4;
    if(++healed>=3)break;
  }

function rangedThreatLimit(){

function fireEnemyAttack(enemy,aim){
  const profile=aim.profile;
  const strength=enemy.attack*profile.power;
  if(profile.seal){
    if(distance(aim,player)<profile.radius)hurt(strength,'施法怪的封印');
    sparks.push({x:aim.x,y:aim.y,life:.32,r:profile.radius});
    return;
  }
  const offset=Math.min(12,enemy.r);
  enemyShots.push({x:enemy.x+aim.dx*offset,y:enemy.y+aim.dy*offset,dx:aim.dx,dy:aim.dy,
    speed:profile.speed,radius:profile.radius,life:(profile.range+24)/profile.speed,
    damage:strength,source:(enemy.name??'怪物')+'的遠距離攻擊'});
}
function advanceEnemyShots(dt,fromX,fromY){
  enemyShots=enemyShots.filter(shot=>{
    const step=Math.min(dt,shot.life);
    const dx=shot.dx*shot.speed*step,dy=shot.dy*shot.speed*step;
    // Sweep in relative space so shots also collide correctly with a moving player.
    const x=shot.x-fromX,y=shot.y-fromY;
    const portion=dt?step/dt:0;
    const vx=dx-(player.x-fromX)*portion,vy=dy-(player.y-fromY)*portion;
    const closest=clamp(-(x*vx+y*vy)/(vx*vx+vy*vy||1),0,1);
    if((x+vx*closest)**2+(y+vy*closest)**2<=(shot.radius+projectilePlayerRadius)**2){
      hurt(shot.damage,shot.source);
      return false;
    }
    shot.x+=dx;shot.y+=dy;shot.life-=dt;
    return shot.life>0&&shot.x>=0&&shot.x<=mapWidth&&shot.y>=0&&shot.y<=mapHeight;
  });
}
function updateEnemyRanged(dt,fromX,fromY){
  advanceEnemyShots(dt,fromX,fromY);
  let active=enemyShots.length;
  let candidate=null,profile=null,oldest=Infinity;
  for(const enemy of mobs){
    if(enemy.hp<=0||enemy.stun>0||enemy.knockedBackAt===elapsed){
      if(enemy.aim){enemy.aim=null;enemy.rangedReadyAt=elapsed+.85;}
      continue;
    }
    if(enemy.aim){
      if(elapsed>=enemy.aim.firesAt){
        const aim=enemy.aim;
        enemy.aim=null;
        fireEnemyAttack(enemy,aim);

    }

    if(enemy.x<camera.x||enemy.x>camera.x+width||enemy.y<camera.y||enemy.y>camera.y+height)continue;
    const attack=rangedAttacks[enemy.mini?'mini':enemy.kind]??rangedAttacks.shade;

function attract(item,dt,radius,speed){
  const gap=distance(item,player);
  if(gap>=radius||gap===0)return;
  const step=Math.min(gap,speed*dt);
  item.x+=(player.x-item.x)*step/gap;
  item.y+=(player.y-item.y)*step/gap;
}
function activateMagnet(){
  const flights=[];
  const stride=Math.max(1,Math.ceil((stars.length+drops.length)/maxMagnetFlights));
  let index=0,visualTime=magnetPulseTime,bombCount=0,bombArrival=0;
  function launch(item,kind){
    const visible=index++%stride===0;
    if(!visible&&kind!=='bomb')return;
    const duration=.35+(magnetFlightTime-.35)*Math.min(distance(item,player)/1200,1);
    if(kind==='bomb'){
      bombCount++;
      bombArrival=Math.max(bombArrival,duration);
    }
    if(!visible)return;
    visualTime=Math.max(visualTime,duration);
    flights.push({x:item.x,y:item.y,kind,startedAt:elapsed,duration});
  }
  for(const star of stars){launch(star,'xp');player.xp+=star.value;}
  for(const drop of drops){launch(drop,drop.kind);if(drop.kind==='heal')heal(.10);}
  stars=[];drops=[];
  // Keep the reward window bounded even when multiple magnets are picked up in quick succession.
  const previous=magnetEffect;
  const bombBursts=previous?.bombBursts??[];
  if(bombCount)bombBursts.push({at:elapsed+bombArrival,count:bombCount});
  magnetEffect={startedAt:elapsed,rewardAt:previous?.rewardAt??elapsed+Math.max(visualTime,bombArrival),bombBursts,
    flights:[...(previous?.flights??[]),...flights].slice(-maxMagnetFlights)};

function detonateBombs(count=1){
  const targets=mobs.filter(mob=>mob.hp>0);
  const limit=Math.min(targets.length,bombKillLimit*count);
  // Sample without replacement, then let the regular kill loop handle credits and loot.
  for(let i=0;i<limit;i++){
    const j=i+Math.floor(Math.random()*(targets.length-i));
    const target=targets[j];
    targets[j]=targets[i];
    target.hp=0;
    sparks.push({x:target.x,y:target.y,life:.28,r:8});
  }
  sparks.push({x:player.x,y:player.y,life:bombFlashTime,kind:'bomb'});
}
function updateMagnet(finish=false){
  if(!magnetEffect)return;
  let bombs=0;
  if(magnetEffect.bombBursts.length){
    magnetEffect.bombBursts=magnetEffect.bombBursts.filter(burst=>{
      if(!finish&&elapsed<burst.at)return true;
      bombs+=burst.count;
      return false;
    });
  }
  if(bombs)detonateBombs(bombs);
  if(!magnetEffect.bombBursts.length&&elapsed-magnetEffect.startedAt>=magnetFlightTime)magnetEffect=null;

function collectLoot(dt){
  let magnetCollected=false,bombs=0;
  drops=drops.filter(drop=>{
    attract(drop,dt,pickupRadius,240);
    if(distance(drop,player)>=25)return true;
    if(drop.kind==='magnet')magnetCollected=true;
    else if(drop.kind==='heal')heal(.10);
    else if(drop.kind==='bomb')bombs++;

  });
  if(bombs)detonateBombs(bombs);
  if(magnetCollected){

  }

function separateEnemies(enemies){
  if(enemies.length<2)return;
  const cellSize=104;
  const columns=Math.ceil(mapWidth/cellSize)+2;
  const grid=new Map();
  for(let index=0;index<enemies.length;index++){
    const enemy=enemies[index];
    if(enemy.hp<=0)continue;
    const col=Math.floor(enemy.x/cellSize);
    const row=Math.floor(enemy.y/cellSize);
    for(let y=row-1;y<=row+1;y++)for(let x=col-1;x<=col+1;x++){
      const neighbors=grid.get((y+1)*columns+x+1);
      if(!neighbors)continue;
      for(const otherIndex of neighbors){
        const other=enemies[otherIndex];
        const dx=enemy.x-other.x;
        const dy=enemy.y-other.y;
        const spacing=(enemy.r+other.r)*.88;
        const distanceSquared=dx*dx+dy*dy;
        if(distanceSquared>=spacing*spacing)continue;
        const gap=Math.sqrt(distanceSquared);
        const angle=(index+otherIndex)*2.399963;
        const nx=gap>0?dx/gap:Math.cos(angle);
        const ny=gap>0?dy/gap:Math.sin(angle);
        const correction=(spacing-gap)*.8;
        const share=other.r**2/(enemy.r**2+other.r**2);
        enemy.x=clamp(enemy.x+nx*correction*share,15,mapWidth-15);
        enemy.y=clamp(enemy.y+ny*correction*share,15,mapHeight-15);
        other.x=clamp(other.x-nx*correction*(1-share),15,mapWidth-15);
        other.y=clamp(other.y-ny*correction*(1-share),15,mapHeight-15);
      }
    }
    const key=(Math.floor(enemy.y/cellSize)+1)*columns+Math.floor(enemy.x/cellSize)+1;
    if(!grid.has(key))grid.set(key,[]);
    grid.get(key).push(index);
  }
}

function drawMagnetPull(){
  if(!magnetEffect)return;
  const age=elapsed-magnetEffect.startedAt;
  ctx.save();
  for(const delay of [0,.12]){
    const t=(age-delay)/(magnetPulseTime-delay);
    if(t<0||t>=1)continue;
    ctx.globalAlpha=(1-t)*.85;
    circle(player.x,player.y,24+142*t,null,'#71d8ff',4-2*t);
  }
  for(const item of magnetEffect.flights){
    const t=(elapsed-item.startedAt)/item.duration;
    if(t>=1)continue;
    const remaining=(1-t)**2;
    const dx=item.x-player.x,dy=item.y-player.y;
    const x=player.x+dx*remaining,y=player.y+dy*remaining;
    if(x<view.x-24||x>view.x+view.width+24||y<view.y-24||y>view.y+view.height+24)continue;
    const tail=(1-Math.max(0,t-.075))**2;
    ctx.globalAlpha=(1-t*.55)*.75;
    ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(player.x+dx*tail,player.y+dy*tail);
    ctx.strokeStyle=item.kind==='xp'?'#ffdc88':item.kind==='heal'?'#ff97b0':item.kind==='bomb'?'#ffae68':'#71d8ff';
    ctx.lineWidth=item.kind==='xp'?3:5;ctx.stroke();
    ctx.globalAlpha=1-t*.55;
    if(item.kind==='xp')drawXpGem(x,y);
    else drawLootDrop(x,y,item.kind);
  }
  ctx.restore();
}
function drawTargetedBolt(bolt){

    pixel(ctx,'#fff3b4',-2,-2,4,4);
    ctx.restore();return;
  }
  pixel(ctx,'#77e9bc78',-24,-2,18,4);
  ctx.beginPath();ctx.moveTo(-7,-12);ctx.quadraticCurveTo(28,0,-7,12);
  ctx.quadraticCurveTo(12,0,-7,-12);ctx.closePath();
  ctx.fillStyle='#7af0c4';ctx.fill();ctx.strokeStyle='#236776';ctx.lineWidth=2;ctx.stroke();

}
function drawGroundWarning(x,y,r,charge,seal=false){
  circle(x,y,r,'#ec655647','#ffb082',2);

function drawEnemyAim(enemy){
  const aim=enemy.aim;
  const {profile}=aim;
  const charge=clamp(1-(aim.firesAt-elapsed)/profile.windup,0,1);
  if(profile.seal){drawGroundWarning(aim.x,aim.y,profile.radius,charge,true);return;}
  const reach=profile.range+24+Math.min(12,enemy.r);
  ctx.save();ctx.globalAlpha=.55+.4*charge;ctx.strokeStyle='#ffb38e';ctx.lineWidth=2;
  ctx.setLineDash([8,6]);
  ctx.beginPath();ctx.moveTo(enemy.x,enemy.y);
  ctx.lineTo(enemy.x+aim.dx*reach,enemy.y+aim.dy*reach);ctx.stroke();
  ctx.restore();

function drawJigongShot(shot){
  const {index,x,y,angle,age}=shot;
  if(x<view.x-27||x>view.x+view.width+27||y<view.y-27||y>view.y+view.height+27)return;
  ctx.save();ctx.translate(x,y);
  if(index===0){
    ctx.rotate(angle);
    const scale=shot.r/8;
    ctx.scale(scale,scale);
    pixel(ctx,'#382820',-11,-5,18,9);pixel(ctx,shot.evolved?'#d5924c':'#a77a49',-9,-4,14,6);
    pixel(ctx,'#e0bb71',-5,-4,5,5);pixel(ctx,'#ffe0a0',5,-3,4,5);pixel(ctx,'#795237',-10,4,20,3);
    if(shot.returning)pixel(ctx,'#fff0b6',-18,-1,8,3);
  }else if(index===1){
    ctx.rotate(angle);
    pixel(ctx,'#14566b',-12,-4,23,9);pixel(ctx,shot.evolved?'#63e6df':'#49c2dc',-9,-6,16,12);
    pixel(ctx,'#b5f5f3',0,-4,10,5);pixel(ctx,'#66d7ee',-17,-1,7,3);
  }else{
    const shift=Math.round(Math.sin(age*23)*4);
    pixel(ctx,'#d4ffe6',-14+shift,-10,26,4);pixel(ctx,'#8bddba',-11-shift,-5,20,4);
    pixel(ctx,'#4ea895',-7+shift,0,14,4);pixel(ctx,'#acdcbf',-4,5,9,4);
  }
  ctx.restore();
}
function drawJigongWindEyes(jigongWindCasts){
  const r=jigongWindRadius;
  for(const cast of jigongWindCasts)for(const eye of cast.eyes){
    const {x,y}=eye;
    if(x<view.x-r||x>view.x+view.width+r||y<view.y-r||y>view.y+view.height+r)continue;
    const age=elapsed-cast.startedAt;
    circle(x,y,r,'#31676348','#88d8c399',2);
    for(let arm=0;arm<2;arm++)for(let i=0;i<8;i++){
      const angle=age*6+arm*Math.PI-i*.36;
      const reach=6+(i*4-age*26%4);
      const size=i<3?4:6;
      pixel(ctx,i<3?'#d2ffe8':'#82d4be',Math.round(x+Math.cos(angle)*reach)-size/2,Math.round(y+Math.sin(angle)*reach)-2,size,4);
    }
  }
}
function drawPlayerHealth(){
  const w=44,h=8;
  const x=clamp(Math.round((player.x-view.x)*viewZoom-w/2),2,width-w-2);
  const y=clamp(Math.round((player.y-view.y+9)*viewZoom+4),2,height-h-2);
  const hp=clamp(player.hp/player.maxHp,0,1);

function draw(){
  const {jigongWindCasts,jigongShots,ingots,targetedBolts,shots,bricks}=skillCombat.effects();
  // Keep the display camera separate from the combat viewport.
  view.width=width/viewZoom;view.height=height/viewZoom;
  centerCamera(view,view.width,view.height);
  ctx.save();ctx.scale(viewZoom,viewZoom);ctx.translate(-view.x,-view.y);
  background();
  if(jigongWindCasts.length)drawJigongWindEyes(jigongWindCasts);
  for(const mark of warnings){
    const charge=clamp(1-mark.life/mark.duration,0,1);
    drawGroundWarning(mark.x,mark.y,mark.r,charge);
  }
  for(const mob of mobs)if(mob.aim)drawEnemyAim(mob);
  for(const star of stars)drawXpGem(star.x,star.y);
  for(const drop of drops)drawLootDrop(drop.x,drop.y,drop.kind);
  for(const ingot of ingots){
    circle(ingot.x,ingot.y,22,'#ffe59225','#ffdb7a90',2);
    drawIngot(ingot.x,ingot.y);
  }
  for(const mob of mobs){
    if(mob.x<view.x-65||mob.x>view.x+view.width+65||mob.y<view.y-65||mob.y>view.y+view.height+65)continue;
    ghost(mob);
  }
  if(boss)ghost(boss);
  for(const bolt of targetedBolts)drawTargetedBolt(bolt);
  for(const shot of jigongShots)drawJigongShot(shot);
  for(const shot of shots)if(shot.lag<=0){
    if(shot.fire){
      for(let i=4;i>0;i--){
        circle(shot.x-Math.cos(shot.angle)*i*5,shot.y-Math.sin(shot.angle)*i*5,12-i*1.8,'#fc6d4b');
      }
      circle(shot.x,shot.y,9,'#fff097','#ff9739',4);
      continue;
    }
    circle(shot.x,shot.y,11,null,'#713e4b',7);
    circle(shot.x,shot.y,11,null,'#ffd65e',4);
    starShape(shot.x+8,shot.y-8,5,'#fff0ac');
  }
  const wheelScale=player.wheels&&player.evolved[1]?wheelEvolutionScale:1;
  for(const flame of wheelTrail){
    ctx.globalAlpha=flame.life/.32;
    circle(flame.x,flame.y,(5+flame.life*26)*wheelScale,'#ff7034');
    circle(flame.x,flame.y,(3+flame.life*14)*wheelScale,'#ffe477');
  }
  ctx.globalAlpha=1;
  for(const wheel of wheelPoints()){
    circle(wheel.x,wheel.y,22*wheelScale,'#ff6f4d','#71354d',3);
    circle(wheel.x,wheel.y,10*wheelScale,null,'#ffd575',4);
    starShape(wheel.x,wheel.y,7*wheelScale,'#fff3b7');
  }
  for(const brick of bricks){
    const t=clamp(1-brick.left/.44,0,1);
    const x=brick.fromX+(brick.x-brick.fromX)*t;
    const y=brick.fromY+(brick.y-brick.fromY)*t-Math.sin(t*Math.PI)*55;
    if(brick.ingot){drawIngot(x,y);continue;}
    ctx.fillStyle='#ffd169';ctx.strokeStyle='#8f5550';ctx.lineWidth=3;
    ctx.fillRect(x-12,y-8,24,14);ctx.strokeRect(x-12,y-8,24,14);
  }
  drawMagnetPull();
  for(const shot of enemyShots)drawEnemyShot(shot);
  const {x,y}=player;
  pixel(ctx,'#18292e88',Math.round(x)-12,Math.round(y)+3,24,7);
  const flying=player.moving&&mode==='play';
  const attacking=player.attackUntil>elapsed;
  if(characterSheet(player.character).naturalWidth){
    const attackTime=elapsed-player.attackAt;
    const pose=player.character==='jigong'?(attacking?(attackTime<.100?0:attackTime<.185?1:2):0):attacking?'attack':flying?'fly':'idle';
    const hover=attacking?0:Math.round(Math.sin(elapsed*(flying?15:5))*(flying?3:1));
    drawPlayerSprite(pose,x,y+7+hover,attacking?player.attackFacing:player.facing);
  }
  for(const spark of sparks){
    if(spark.kind==='boss-xp'){
      ctx.save();ctx.globalAlpha=Math.min(1,spark.life*2);
      ctx.textAlign='center';ctx.textBaseline='bottom';ctx.font='bold 20px system-ui';
      ctx.lineWidth=4;ctx.strokeStyle='#24323c';ctx.fillStyle='#ffdc88';
      const y=spark.y-30-(bossXPNoticeTime-spark.life)*26;
      const label='+'+spark.value+' XP';
      ctx.strokeText(label,spark.x,y);ctx.fillText(label,spark.x,y);ctx.restore();
    }else if(spark.kind==='ring-burst'){
      const fade=spark.life/ringExplosionLife;
      ctx.save();ctx.globalAlpha=fade;
      circle(spark.x,spark.y,spark.r,'#f57a4d22','#ffe19a',2);
      starShape(spark.x,spark.y,Math.min(28,spark.r*.52)*(1+(1-fade)*.25),'#ffb96f');
      ctx.restore();
    }else if(spark.kind==='bomb'){
      const fade=spark.life/bombFlashTime;
      ctx.save();ctx.globalAlpha=fade;
      starShape(spark.x,spark.y-6,16+23*(1-fade),'#ffb563');
      starShape(spark.x,spark.y-6,7+10*(1-fade),'#fff0a3');
      ctx.restore();
    }else if(spark.r>10)circle(spark.x,spark.y,spark.r,null,'#ffdb8ba8',3);
    else starShape(spark.x,spark.y,8+spark.life*35,'#fff1bf');
  }
  ctx.restore();
  if(mode==='play')drawPlayerHealth();
  if(stick){
    const size=Math.hypot(stick.dx,stick.dy),[sx,sy]=unit(stick.dx,stick.dy);
    circle(stick.x,stick.y,34,'#38244a66','#fff4db99');
    circle(stick.x+sx*Math.min(size,25),stick.y+sy*Math.min(size,25),13,'#ffd88ed9');
  }
}

function drawWaveHud(){
  let message='',warning=false;
  if(towerFloor){
    message=boss?'守關魔王出現':'本層擊退 '+Math.min(floorKills,towerGoal)+' / '+towerGoal;
  }else if(!boss){
    const wave=storyWaves[nextWave];
    if(wave){
      const untilWave=wave.at-time;
      if(untilWave>0&&untilWave<=waveWarningTime){
        warning=true;
        message='怪潮預警・'+Math.ceil(untilWave)+' 秒';
      }else if(untilWave<=0){
        message=wave.name+'・'+Math.ceil(wave.duration+untilWave)+' 秒';
      }
    }
  }
  waveHud.hidden=!message;
  waveHud.classList.toggle('wave-warning',warning);
  if(waveHud.textContent!==message)waveHud.textContent=message;
}
function drawSkillHud(){
  const qi=player.qi;
  setText(qiSlot.name,'氣功普攻');
  setText(qiSlot.status,'強化 '+qi.rank+' · '+qi.timer.toFixed(2)+' 秒');
  setProgress(qiSlot.bar,1-qi.timer/qi.cooldown);
  const jigong=player.character==='jigong';
  const limits=jigong?player.jigong.map(skill=>skill.cooldown):[ringCooldown,wheelCooldown,brickCooldown];
  const cooldowns=jigong?player.jigong.map(skill=>skill.timer):[player.ringTimer,player.wheelTimer,player.brickTimer];
  const openSlot=NezhaRules.hasSlot(player);
  skillSlots.forEach(({name,status,bar},index)=>{
    const level=player.skillLevels[index];
    const cooldown=Math.max(0,cooldowns[index]);
    const title=activeSkillName(index);
    setText(name,(index+1)+' '+title);
    const label=title+'冷卻';
    if(bar.getAttribute('aria-label')!==label)bar.setAttribute('aria-label',label);
    setText(status,level?'Lv.'+level+' · '+'CD '+cooldown.toFixed(1)+' 秒':openSlot?'尚未解鎖':'需絕世寶典');
    setProgress(bar,level?1-cooldown/limits[index]:0);
  });
  setText(gear,NezhaRules.gearNames.map((name,index)=>name+' Lv.'+player.gear[index]).join('　'));
}
function setText(element,value){
  const text=String(value);
  if(element.textContent!==text)element.textContent=text;
}
function setProgress(element,value,max=1){
  if(element.max!==max)element.max=max;
  const next=clamp(value,0,max);
  if(element.value!==next||!element.hasAttribute('value'))element.value=next;
}

for(const entry of updateHistory){
  const section=document.createElement('section');
  const title=document.createElement('h3');title.textContent=entry.title;
  const date=document.createElement('time');date.dateTime=entry.date;date.textContent=entry.date.replaceAll('-','/');
  const list=document.createElement('ul');
  for(const [label,detail] of entry.changes){
    const item=document.createElement('li'),heading=document.createElement('strong');heading.textContent=label+'：';
    item.append(heading,detail);list.append(item);
  }
  section.append(title,date,list);document.querySelector('#update-entries').append(section);
}
document.querySelector('#updates').onclick=()=>{
  if(mode==='play')togglePause();
  if(!updateDialog.open)updateDialog.showModal();
};
let previous=null,framePending=false;
function requestFrame(){
  if(framePending)return;
  framePending=true;
  requestAnimationFrame(frame);
}
function frame(now){
  framePending=false;
  if(mode==='play'){
    const dt=previous===null?0:Math.min(.035,(now-previous)/1000);
    previous=now;
    update(dt);
  }
  draw();
  const unlocked=unlockToastUntil>elapsed;
  if(unlockToast.hidden===unlocked)unlockToast.hidden=!unlocked;
  if(mode==='lobby')return;
  drawSkillHud();
  setText(health,Math.ceil(player.hp)+'/'+player.maxHp);
  setText(attack,Math.round(player.attack*100)/100);
  setText(defense,Math.round(player.defense*100)/100);
  setText(moveSpeed,player.speed+'/'+maxMoveSpeed);
  drawWaveHud();
  setText(clock,towerFloor?'無限塔 '+towerFloor+' 層':formatTime(time)+(boss?' 暫停':' / '+formatTime(rounds)));
  bossbar.hidden=!boss;
  if(boss){
    const pressure=bossPressure();
    setText(bossname,boss.name+(pressure>0?' · 強化 '+Math.round(pressure*100)+'%':''));
    setProgress(bossHP,boss.hp,boss.maxHp);
  }
  setText(level,'等級 '+player.level);
  const requiredXP=needed();
  setText(score,'擊退 '+kills+' · XP '+xpNumber.format(player.xp)+' / '+xpNumber.format(requiredXP));
  const ready=mode==='play'&&player.xp>=requiredXP?availableLevels():0;
  if(spendXPButton.disabled!==!ready)spendXPButton.disabled=!ready;
  const label=ready?'升級 ×'+(ready>99?'99+':ready):'升級';
  if(spendXPButton.textContent!==label)spendXPButton.textContent=label;
  setProgress(xp,player.xp,requiredXP);
  if(mode==='play')requestFrame();
}
