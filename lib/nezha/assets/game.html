<!doctype html>
<html lang="zh-Hant">

<style>
:root{color-scheme:dark;--night:#101d25;--panel:#1c3038;--line:#526668;--ink:#fff3dc;--muted:#ced6c9;--gold:#ffcf77;--red:#d96c52;--mint:#8ad4b5}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--night);color:var(--ink);font:16px system-ui,sans-serif}
main{height:100dvh;max-width:1320px;margin:auto;display:flex;flex-direction:column;padding:16px 22px;gap:10px}
header,footer{display:flex;justify-content:space-between;align-items:center;gap:8px}
header a{text-decoration:none}header small{display:block;color:var(--gold);font-size:12px}
header strong{display:block;white-space:nowrap;font-size:24px}
button{font:inherit;font-weight:800;border:2px solid #141f26;border-radius:4px;background:var(--gold);color:#331e22;padding:8px 13px;cursor:pointer;box-shadow:0 3px #a45d42}
button:hover:enabled{background:#ffe0a1}button:disabled{opacity:.55;cursor:default}
button:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid white;outline-offset:3px}
.account{display:flex;justify-content:flex-end;align-items:center;gap:8px;min-width:0;font-size:14px}
.account button{flex-shrink:0;padding:5px 9px}.account #nickname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
.field{position:relative;overflow:hidden;flex:1;min-height:0;border:2px solid #b78d59;border-radius:4px;background:#34454a;box-shadow:0 0 0 2px #0a151d}
canvas{width:100%;height:100%;display:block;touch-action:none;image-rendering:pixelated}
.hud{pointer-events:none;position:absolute;top:12px;inset-inline:12px;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:start;gap:5px;font-weight:800}
.hud span,.stats,.bossbar,.wave{background:#17252ff2;border:1px solid #9d8062;border-radius:2px}
.hud span{padding:6px 10px;font-size:14px;white-space:nowrap}.hud #level{justify-self:end}
.stats{justify-self:start;display:grid;grid-template-columns:auto auto;gap:2px 6px;margin:0;padding:6px 8px;font-size:12px}
.stats dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}.stats dd:first-of-type{color:var(--mint)}
.wave{position:absolute;top:49px;right:12px;padding:4px 6px;color:#ffe4ac;font-size:12px;font-weight:800;pointer-events:none}
.wave-warning{border-color:var(--red);background:#392626;color:var(--ink)}
.bossbar{position:absolute;top:101px;left:50%;transform:translateX(-50%);width:min(320px,82%);text-align:center;padding:5px 10px;font-weight:800;font-size:14px}
progress{appearance:none;border:0;border-radius:0;background:#0c1922;color:var(--gold)}
progress::-webkit-progress-bar{background:#0c1922}progress::-webkit-progress-value{background:var(--fill,var(--gold))}
progress::-moz-progress-bar{background:var(--fill,var(--gold))}
.bossbar progress{display:block;width:100%;height:8px;margin-top:4px;--fill:#f07c61}
.field>#xp{position:absolute;left:10px;bottom:10px;width:calc(100% - 20px);height:8px;--fill:var(--mint)}
.overlay{position:absolute;inset:0;overflow:auto;display:grid;place-items:center;background:#0e1925a6;padding:10px}
.card{width:min(430px,100%);padding:21px;text-align:center;background:#21343b;color:var(--ink);border:2px solid #e5ab65;box-shadow:0 0 0 3px #162126,0 8px #101b22;border-radius:4px;overflow-wrap:anywhere}
.card h1{font-size:29px;line-height:1.15;margin:4px 0 10px;color:var(--gold)}
.card p{line-height:1.5;margin:7px 0 12px;font-size:14px;color:#e3e7d8}
.card .portrait{width:96px;height:96px;margin:auto}
.card .portrait:not([data-loaded]){visibility:hidden}
.actions{display:grid;gap:7px}.actions button{width:100%;text-align:left;padding:7px 10px}
.card:has(.level-up-actions){width:min(660px,100%)}
.level-up-actions{grid-template-columns:repeat(2,minmax(0,1fr))}
.level-up-actions button{min-width:0;min-height:44px;font-size:14px;line-height:1.3}
.skills{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.skill{min-width:0;background:var(--panel);border:1px solid var(--line);border-top:2px solid var(--red);padding:6px 8px}
.skill:first-child{border-top-color:#71d8ff}.skill:nth-child(3){border-top-color:var(--gold)}.skill:nth-child(4){border-top-color:var(--mint)}
.skill:first-child progress{--fill:#71d8ff}
.skill strong,.skill small{display:block;line-height:1.25;overflow-wrap:anywhere}
.skill strong{font-size:14px}.skill small{margin-top:2px;color:var(--muted);font-size:12px}
.skill progress{display:block;width:100%;height:4px;margin-top:4px}
#gear,.hint{font-size:12px;color:var(--muted)}
.hint{flex-wrap:wrap}.hint #score{font-variant-numeric:tabular-nums}
.ranking{max-height:25dvh;overflow:auto;text-align:left;padding-left:28px}
.ranking li{padding:4px;overflow-wrap:anywhere}
.ranking-message{display:block;color:#ffd389;white-space:pre-wrap;font-size:14px}
.ranking-editor{display:grid;gap:6px;margin:10px 0;text-align:left}
.ranking-editor label,.card [role=status]{font-weight:700;font-size:14px}
.ranking-editor textarea{width:100%;min-height:56px;resize:vertical;padding:6px 8px;border:1px solid #a38b66;border-radius:3px;background:#152931;color:var(--ink);font:inherit}
.ranking-editor button{justify-self:start;padding:5px 12px}
@media(max-width:560px){
  main{padding:8px;gap:6px}header strong{font-size:18px}.account{gap:4px;font-size:12px}
  .hud{inset-inline:6px;top:6px;grid-template-columns:minmax(0,max-content) 1fr auto}
  .hud #clock{justify-self:center}.hud span,.stats{padding:4px;font-size:11px}
  .wave{top:35px;right:6px;font-size:10px}.bossbar{top:75px}
  .card{padding:13px}.card h1{font-size:23px}.skill{padding:4px}.skill strong{font-size:12px}
  .level-up-actions{gap:5px}.level-up-actions button{padding:5px 6px;font-size:12px}
  .hint .controls{display:none}
}
@media(max-width:420px){
  .skills{grid-template-columns:repeat(2,minmax(0,1fr));gap:4px}
}
@media(max-height:470px){
  main{padding-block:5px;gap:4px}
  .card{padding:10px}.card h1{font-size:21px;margin:2px 0 5px}
  .card .portrait{width:56px;height:56px}.card p{margin:4px 0 6px}
  .card:has(.tome-actions) .portrait{display:none}
  .tome-actions{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tome-actions button:first-child{grid-column:1/-1}
  #gear,.hint .controls{display:none}
}
@media(min-width:540px) and (max-height:470px){
  .level-up-actions{grid-template-columns:repeat(4,minmax(0,1fr));gap:5px}
  .level-up-actions button{padding:5px 6px;font-size:12px;line-height:1.25}
}

<script>
const canvas = document.querySelector('canvas');
const ctx = canvas.getContext('2d');
const overlay = document.querySelector('#overlay');
const card = document.querySelector('#card');
const pause = document.querySelector('#pause');
const heroSheet = new Image();
const heroSheetUrl = '/games/nezha/nezha-sheet.png';
let heroSheetFailed = false;
const heroCellSize = 724;
// Each body stays centered on the same point, including the wider attack pose.
const heroPoses = {

const keys = new Set();
const rounds = 480;
const lateStoryXPStart = 300;
const lateStoryXPFullAt = 450;

const bossXPNoticeTime = 1.2;
const contactHitInterval = 0.5;

const mapHeight = 2160;
const wheelOrbitRadius = 96;

const wheelEvolutionScale = Math.SQRT2;
const wheelKnockbackCooldown = .5;
const maxWheels = 8;
const tileWidth = 48;
const pickupRadius = 2 * tileWidth;
const bombKillLimit = 20;
const bombFlashTime = .4;
const magnetFlightTime = .9;
const magnetPulseTime = .55;
const maxMagnetFlights = 180;
const bossStages = [
  {at:120,name:'超級大幽靈',xp:500,hp:210,attack:22,speed:70,r:35,color:'#e9d8ff',interval:3.5},
  {at:300,name:'重甲幽靈',xp:500,hp:465,attack:32,speed:59,r:42,color:'#b8b0ee',interval:2.8},
  {at:480,name:'超級龍王',xp:1000,hp:870,attack:42,speed:87,r:49,color:'#61d9a5',interval:2.7}
];
const maxMoveSpeed=100;
const maxHealth=2000;

const armorDefenseGain=9;
const normalSkillLimit=2;
const skillTomeChance=.005;
const favoriteRouteFactor=1.30;
const baseQi={cooldown:1.05,targets:1};
const qiAttackGain=3;
const qiRange=360;
const qiSpeed=680;
const qiMinCooldown=.35;
const qiMaxTargets=5;
const towerBaselineFloor=4;
const towerFloorGrowth=1.15;
const baseStats={hp:100,attack:25,defense:25,speed:45};
const storyMobLimit=80;
const waveWarningTime=4;
const storyWaves=[
  {at:80,duration:25,count:60,name:'幽靈來襲',kinds:['shade','shade','shade','runner','shade']},
  {at:210,duration:25,count:85,name:'疾風夾擊',kinds:['runner','runner','shade','runner','runner'],split:true},
  {at:375,duration:30,count:110,name:'重甲壓陣',kinds:['guard','guard','shade','guard','guard','caster','guard','shade','guard','shade']}
];
const miniTypes=[
  {name:'赤焰幽靈',color:'#fb8577',hp:75,attack:12,speed:107,r:24},
  {name:'鐵甲幽靈',color:'#9ca9ea',hp:125,attack:17,speed:68,r:28},
  {name:'疾風幽靈',color:'#92ded0',hp:65,attack:10,speed:131,r:21}
];
const mobKinds={
  shade:{hp:1,attack:1,speed:1,radius:13},
  runner:{hp:.64,attack:.7,speed:1.38,radius:11},
  guard:{hp:1.7,attack:1,speed:.72,radius:16},
  healer:{hp:.85,attack:.58,speed:.8,radius:13},
  caster:{hp:.95,attack:.74,speed:.82,radius:13}
};
const rangedAttacks={
  shade:{range:255,windup:.8,recovery:4.9,speed:180,radius:5,power:.60},
  runner:{range:220,windup:.62,recovery:4.5,speed:230,radius:4,power:.55},
  guard:{range:280,windup:1,recovery:5.6,speed:158,radius:8,power:.72},
  healer:{range:255,windup:.85,recovery:6.2,speed:177,radius:5,power:.58},
  caster:{range:280,windup:1.15,recovery:6,radius:30,power:.85,seal:true},
  mini:{range:320,windup:.88,recovery:3.7,speed:222,radius:8,power:.78}
};
const projectilePlayerRadius=12;
const towerGoal=1000;
let towerFloor, floorKills, floorTime, towerTime, clearedFloors, towerBaseline;
let optionButtons=[];
const miniBossChance=.30;
let nextWave, waveSlots, miniBossKills, miniBossThreshold, gearRewards, nextRewardAt;
let boss, nextBoss, elapsed, targetedBolts, shots, bricks, warnings, drops, ingots, wheelTrail, trailTimer;
let enemyShots, nextEnemyAimAt;
let magnetEffect;
let camera = {x:0,y:0};
let width, height, player, mobs, stars, sparks, time, spawn, kills, mode;
let stick = null;
const clamp = (n,min,max) => Math.max(min,Math.min(max,n));
const distance = (a,b) => Math.hypot(a.x-b.x,a.y-b.y);
const unit = (x,y) => {const length = Math.hypot(x,y) || 1; return [x/length,y/length];};
function resize(){
  const box = canvas.getBoundingClientRect();
  width = box.width; height = box.height;
  const ratio = .5;
  canvas.width = Math.max(1,Math.round(width*ratio));
  canvas.height = Math.max(1,Math.round(height*ratio));
  if(!width||!height)return;
  ctx.setTransform(canvas.width/width,0,0,canvas.height/height,0,0);
  ctx.imageSmoothingEnabled=false;
}
function trackCamera(){
  camera.x=clamp(player.x-width/2,0,Math.max(0,mapWidth-width));
  camera.y=clamp(player.y-height/2,0,Math.max(0,mapHeight-height));
}
function reset(){
  player = {x:mapWidth/2,y:mapHeight/2,hp:baseStats.hp,maxHp:baseStats.hp,defense:baseStats.defense,attack:baseStats.attack,speed:baseStats.speed,
    qi:{...baseQi,rank:1,timer:0},
    xp:0,level:1,rings:0,ringDamage:baseStats.attack,pattern:0,wheels:0,wheelDamage:15,
    wheelSpeed:2.5,wheelAngle:0,wheelTimer:0,bricks:0,ringTimer:0,brickTimer:5,brickDamage:42,
    skillLevels:[0,0,0], skillRoutes:[null,null,null], skillTome:false, evolved:[false,false,false], gear:[0,0,0,0],
    deathCause:null,
    moving:false,heading:0,facing:-1,attackFacing:-1,attackUntil:-1};
  mobs=[]; stars=[]; sparks=[]; targetedBolts=[]; shots=[]; bricks=[]; warnings=[]; drops=[]; ingots=[]; wheelTrail=[]; trailTimer=0;
  enemyShots=[];nextEnemyAimAt=0;
  magnetEffect=null;
  time=0; elapsed=0; spawn=.35; kills=0; boss=null; nextBoss=0;
  towerFloor=0;clearedFloors=0;floorKills=0;floorTime=0;towerTime=0;
  towerBaseline=null;
  nextWave=0;waveSlots=0;miniBossKills=0;miniBossThreshold=50;gearRewards=0;nextRewardAt=0;
  trackCamera();
}
function setMode(next){
  mode=next; overlay.hidden=next==='play'; pause.disabled=next!=='play';
  if(next!=='play'){stick=null; keys.clear();}
  else optionButtons=[];
}
function panel(title,desc,choices,portrait=false){
  card.replaceChildren();
  if(portrait){
    const preview=document.createElement('canvas');
    preview.className='portrait';
    preview.width=96;preview.height=96;
    preview.setAttribute('role','img');
    preview.setAttribute('aria-label','像素三太子');
    drawHeroPortrait(preview);
    card.append(preview);
  }
  const h=document.createElement('h1'); h.textContent=title;
  const p=document.createElement('p'); p.textContent=desc;
  const actions=document.createElement('div'); actions.className='actions';
  optionButtons=choices.map(([label,action],index)=>{
    const button=document.createElement('button');
    button.textContent=(index+1)+'　'+label;
    button.disabled=!action;
    if(action)button.addEventListener('click',action);
    actions.append(button);
    return button;
  });
  card.append(h,p,actions);
  if(mode!=='ready') actions.querySelector('button:enabled')?.focus({preventScroll:true});
  return actions;
}
function start(){reset();setMode('play');}
function retryHeroSheet(){
  heroSheetFailed=false;
  heroSheet.src=heroSheetUrl+'?retry='+Date.now();
  showStart();
}
function showStart(){
  setMode('ready');
  const play=heroSheetFailed?['重試載入角色',retryHeroSheet]:heroSheet.naturalWidth?['開始守廟埕',start]:['角色載入中…',null];
  const description=heroSheetFailed?'三太子圖片載入失敗，請重試。':'探索廟埕、擊退小幽靈，在第 2、5、8 分鐘迎戰魔王。擊倒超級龍王後，帶著法寶進入無限塔。';
  panel('神明Q仙傳',description,[play,['無限塔排行榜',()=>showLeaderboard(showStart)]],true);
}
function togglePause(){
  if(mode==='play'){
    setMode('paused'); panel('休息一下','準備好就回廟埕繼續玩。',[['繼續遊戲',()=>setMode('play')],['重新開始',start]]);
  }else if(mode==='paused')setMode('play');
}
pause.onclick=togglePause;
document.addEventListener('keydown',event=>{
  if(event.target instanceof HTMLTextAreaElement)return;
  const key=event.key.toLowerCase();
  if(mode!=='play'&&/^[1-8]$/.test(key)&&!event.altKey&&!event.ctrlKey&&!event.metaKey){
    const choice=optionButtons[Number(key)-1];
    if(choice){
      event.preventDefault();
      if(!event.repeat)choice.click();
    }
    return;
  }
  if(['arrowleft','arrowright','arrowup','arrowdown','w','a','s','d'].includes(key)&&mode==='play'){
    event.preventDefault(); keys.add(key);
  }
  if(key==='escape'&&!event.repeat)togglePause();
});
document.addEventListener('keyup',event=>keys.delete(event.key.toLowerCase()));
window.addEventListener('blur',()=>{if(mode==='play')togglePause();});
canvas.addEventListener('pointerdown',event=>{
  if(mode!=='play'||stick)return;
  canvas.setPointerCapture(event.pointerId);
  stick={id:event.pointerId,x:event.offsetX,y:event.offsetY,dx:0,dy:0};
});
canvas.addEventListener('pointermove',event=>{
  if(stick?.id!==event.pointerId)return;
  stick.dx=event.offsetX-stick.x; stick.dy=event.offsetY-stick.y;
});
for(const name of ['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(name,event=>{if(stick?.id===event.pointerId)stick=null;});
function wheelPoints(){
  return Array.from({length:player.wheels},(_,i)=>{
    const angle=player.wheelAngle+i*2*Math.PI/player.wheels;
    return {x:player.x+Math.cos(angle)*wheelOrbitRadius,y:player.y+Math.sin(angle)*wheelOrbitRadius};
  });
}
function wheelSweepsEnemy(enemy,start,sweep,hitRadius){
  const dx=enemy.x-player.x,dy=enemy.y-player.y;
  const gap=Math.hypot(dx,dy),reach=enemy.r+hitRadius;
  if(Math.abs(gap-wheelOrbitRadius)>=reach)return false;
  // Even spacing reduces all the wheel arcs to one repeating sector.
  const spacing=2*Math.PI/player.wheels;
  const relative=(Math.atan2(dy,dx)-start)%spacing;
  const offset=relative<0?relative+spacing:relative;
  if(offset<=sweep)return true;
  const angleGap=Math.min(offset-sweep,spacing-offset);
  return gap*gap+wheelOrbitRadius*wheelOrbitRadius-2*gap*wheelOrbitRadius*Math.cos(angleGap)<reach*reach;
}
const challengeTime=()=>time+towerTime;
function skillAttackGrowth(){
  let skillGrowth=1;
  if(player.rings)skillGrowth=Math.max(skillGrowth,player.ringDamage/baseStats.attack*(player.evolved[0]?1.5:1));
  if(player.wheels)skillGrowth=Math.max(skillGrowth,player.wheelDamage/15);
  if(player.bricks)skillGrowth=Math.max(skillGrowth,player.brickDamage/42);
  return skillGrowth;
}
function currentEnemyBalance(){
  // Keep the existing enemy curve independent of the new player-only stat gains.
  const levelGrowth=(player.level-1)*enemyReferenceStatGain;
  const referenceAttack=baseStats.attack+levelGrowth+player.gear[3]*swordAttackGain;
  const referenceDefense=baseStats.defense+levelGrowth+player.gear[1]*armorDefenseGain;
  const durability=(player.maxHp/baseStats.hp)*(100+referenceDefense)/(100+baseStats.defense);
  const ringVolley=player.rings*player.ringDamage*(player.evolved[0]?1.5:1);
  const wheelSweep=player.wheels*player.wheelDamage;
  const brickVolley=player.bricks*player.brickDamage;
  return {
    time:challengeTime(),
    attackGrowth:referenceAttack/baseStats.attack*skillAttackGrowth(),
    durability:Math.pow(durability,.65),
    level:Math.min(player.level,50),
    burst:(ringVolley+wheelSweep+brickVolley)*referenceAttack/baseStats.attack,
    miniAttackScaling:miniBossThreshold>50
  };
}
const enemyBalance=()=>towerBaseline??currentEnemyBalance();
const baseTowerFloor=()=>Math.min(towerFloor,towerBaselineFloor);
const towerStrength=()=>towerFloorGrowth**Math.max(0,towerFloor-towerBaselineFloor);
function scaledEnemyAttack(attack,balance){
  return attack*balance.durability*towerStrength();
}
function levelHealthGrowth(rate,balance){
  return 1+rate*(balance.level-1)**1.2;
}
function scaledBossHealth(hp,balance){
  const base=Math.max(hp*1.2*balance.attackGrowth**.65,balance.burst*(4+Math.log2(1+baseTowerFloor())*.4));
  return Math.round(base*levelHealthGrowth(.023,balance)*towerStrength());
}
function chooseMobKind(){

function splitWaveAngle(slot){
  const horizontalRoom=Math.min(player.x,mapWidth-player.x);
  const verticalRoom=Math.min(player.y,mapHeight-player.y);
  const spread=(Math.random()-.5)*Math.PI/4;
  // Near corners, use two inward lanes so edge clamping cannot spawn enemies on the player.
  if(Math.max(horizontalRoom,verticalRoom)<250){
    const inward=Math.atan2(mapHeight/2-player.y,mapWidth/2-player.x);
    return inward+(slot%2?1:-1)*Math.PI/6+spread;
  }
  return (horizontalRoom>=verticalRoom?0:Math.PI/2)+(slot%2)*Math.PI+spread;
}
function updateWave(){
  const wave=storyWaves[nextWave];
  if(!wave||time<wave.at)return false;
  const age=Math.min(time-wave.at,wave.duration);
  const target=Math.floor(wave.count*age/wave.duration);
  for(let slot=waveSlots;slot<target&&mobs.length<storyMobLimit;slot++){
    addMob(true,wave.kinds[slot%wave.kinds.length],wave.split?splitWaveAngle(slot):undefined);
  }
  // Consume capped slots too, so opening up space never releases a backlog.
  waveSlots=target;
  if(age>=wave.duration){nextWave++;waveSlots=0;}
  return true;
}
function updateSpawns(dt){

  const batch=towerFloor?Math.min(20,12+towerFloor+Math.floor(floorTime/70)):1+Math.floor(time/120);
  const limit=towerFloor?230:storyMobLimit;
  for(let i=0;i<batch&&mobs.length<limit;i++)addMob(Boolean(towerFloor));

function regularLevelXP(targetLevel){
  if(targetLevel<=20)return 5+10*(targetLevel-2);
  if(targetLevel<=40)return 195+13*(targetLevel-21);
  if(targetLevel>=50)return 599;
  return Math.round(599+(targetLevel-50)*(158/9));
}
function needed(){

  if(targetLevel===41)return 2855;
  return regularLevelXP(targetLevel);

function timeBasedEnemyXP(seconds){
  const minutes=Math.floor(seconds/60);
  return 1+minutes+Math.floor(minutes/3);
}
function enemyXP(enemy){
  const seconds=towerBaseline?.time??challengeTime();
  let base=timeBasedEnemyXP(seconds);
  if(towerFloor){
    // Carry the story bonus into the tower without changing its time or floor growth.
    base+=storyFinalMonsterXP-timeBasedEnemyXP(rounds)+baseTowerFloor()*2;
  }else if(seconds>=lateStoryXPStart){
    const progress=clamp((seconds-lateStoryXPStart)/(lateStoryXPFullAt-lateStoryXPStart),0,1);
    const startingXP=timeBasedEnemyXP(lateStoryXPStart);
    base=Math.max(base,startingXP+Math.floor((storyFinalMonsterXP-startingXP)*progress));
  }
  return base*(enemy.mini?3:1);
}

function addLeaderboardEditor(score,messageLabel,list){
  const form=document.createElement('form');
  form.className='ranking-editor';
  const label=document.createElement('label');
  label.htmlFor='ranking-message-input';
  const updateLabel=count=>{
    label.textContent='排行榜留言（剩 '+count+' 次，最多 80 字，可宣傳品牌）';
  };
  updateLabel(score.messageCredits);
  const input=document.createElement('textarea');
  input.id=label.htmlFor;
  input.rows=2;
  input.maxLength=80;
  input.value=score.message??'';
  input.required=true;
  const save=document.createElement('button');
  save.type='submit';
  save.textContent='儲存留言';
  const status=document.createElement('div');
  status.setAttribute('role','status');
  form.append(label,input,save,status);
  list.before(form);

  form.addEventListener('submit',async event=>{
    event.preventDefault();
    if(save.disabled)return;
    save.disabled=true;
    input.readOnly=true;
    status.textContent='';
    try{
      const {message,messageCredits}=await accountRequest('leaderboard/message',{message:input.value});
      messageLabel.textContent=message;
      status.textContent='留言已刊登。';
      if(messageCredits>0){
        updateLabel(messageCredits);
      }else{
        label.remove();input.remove();save.remove();
      }
    }catch(error){status.textContent=error.message;}
    finally{save.disabled=false;input.readOnly=false;}
  });
}

        if(distance(enemy,player)>qiRange)break;
        launchTargetedBolt(player,enemy,qiSpeed);
      }
      qi.timer=qi.cooldown;
    }
    if(player.rings&&player.ringTimer<=0&&target){
      poseForAttack(target);
      for(let i=0;i<player.rings;i++){
        const offset=i-(player.rings-1)/2;
        const angle=aim+(player.pattern===2?i*2*Math.PI/player.rings:offset*(player.pattern===1?.29:.037));
        const lag=player.pattern===0?i*.075:0;
        shots.push({x:player.x,y:player.y,angle,lag,life:1.2,fire:player.evolved[0]});
      }
      player.ringTimer=ringCooldown;
    }
    if(player.bricks&&player.brickTimer<=0&&target){
      poseForAttack(target);
      for(let i=0;i<player.bricks;i++){
        const enemy=targets[i%targets.length];
        const offset=targets.length<=i?12*(i%3-1):0;
        bricks.push({x:enemy.x+offset,y:enemy.y-offset,fromX:player.x,fromY:player.y,left:.4+i*.09,ingot:player.evolved[2]});
      }
      player.brickTimer=brickCooldown;
    }
  }
  targetedBolts=targetedBolts.filter(bolt=>{
    bolt.life-=dt;
    if(bolt.life<=0||bolt.target.hp<=0)return false;
    const gap=distance(bolt,bolt.target),step=bolt.speed*dt;
    if(gap<=step+bolt.target.r){
      if(bolt.basePower===null)applyHit(bolt.target,player.attack);
      else damage(bolt.target,bolt.basePower);
      return false;
    }
    const dx=bolt.target.x-bolt.x,dy=bolt.target.y-bolt.y;
    bolt.angle=Math.atan2(dy,dx);
    bolt.x+=dx*step/gap;bolt.y+=dy*step/gap;
    return true;
  });
  shots=shots.filter(shot=>{
    shot.lag-=dt;
    if(shot.lag>0){shot.x=player.x;shot.y=player.y;return true;}
    shot.life-=dt;
    if(shot.life<=0)return false;
    shot.x+=Math.cos(shot.angle)*415*dt;shot.y+=Math.sin(shot.angle)*415*dt;
    const hit=enemies.find(enemy=>enemy.hp>0&&distance(shot,enemy)<enemy.r+11);
    if(hit){
      const value=player.ringDamage*(shot.fire?1.5:1);
      damage(hit,value);
      if(shot.fire&&Math.random()<ringExplosionChance)explodeRingHit(hit,value,enemies);
    }
    return !hit;
  });
  bricks=bricks.filter(brick=>{
    brick.left-=dt;
    if(brick.left>0)return true;
    sparks.push({x:brick.x,y:brick.y,life:.45,r:57});
    for(const enemy of enemies){
      if(enemy.hp<=0||distance(brick,enemy)>57+enemy.r)continue;
      damage(enemy,player.brickDamage);
      if(Math.random()<.5)enemy.stun=3;
    }
    if(brick.ingot)ingots.push({x:brick.x,y:brick.y,life:10,nextShotAt:elapsed+ingotShotInterval});
    return false;
  });
}
function heal(fraction){

function healEnemyAllies(enemy,allies){

  enemy.abilityAt=elapsed+4;
  let healed=0;
  for(const ally of allies){
    if(ally===enemy||ally===boss||ally.hp<=0||ally.hp>=ally.maxHp||distance(enemy,ally)>105)continue;
    ally.hp=Math.min(ally.maxHp,ally.hp+Math.ceil(ally.maxHp*.10));

  }

function rangedThreatLimit(){

  return towerFloor?4:time<60?1:time<180?2:3;

function fireEnemyAttack(enemy,aim){
  const profile=aim.profile;
  const strength=enemy.attack*profile.power;
  if(profile.seal){
    if(distance(aim,player)<profile.radius)hurt(strength,'施法怪的封印');
    sparks.push({x:aim.x,y:aim.y,life:.32,r:profile.radius});
    return;
  }
  const offset=Math.min(12,enemy.r);
  enemyShots.push({x:enemy.x+aim.dx*offset,y:enemy.y+aim.dy*offset,dx:aim.dx,dy:aim.dy,
    speed:profile.speed,radius:profile.radius,life:(profile.range+24)/profile.speed,
    damage:strength,source:(enemy.name??'怪物')+'的遠距離攻擊'});
}
function advanceEnemyShots(dt,fromX,fromY){
  enemyShots=enemyShots.filter(shot=>{
    const step=Math.min(dt,shot.life);
    const dx=shot.dx*shot.speed*step,dy=shot.dy*shot.speed*step;
    // Sweep in relative space so shots also collide correctly with a moving player.
    const x=shot.x-fromX,y=shot.y-fromY;
    const portion=dt?step/dt:0;
    const vx=dx-(player.x-fromX)*portion,vy=dy-(player.y-fromY)*portion;
    const closest=clamp(-(x*vx+y*vy)/(vx*vx+vy*vy||1),0,1);
    if((x+vx*closest)**2+(y+vy*closest)**2<=(shot.radius+projectilePlayerRadius)**2){
      hurt(shot.damage,shot.source);
      return false;
    }
    shot.x+=dx;shot.y+=dy;shot.life-=dt;
    return shot.life>0&&shot.x>=0&&shot.x<=mapWidth&&shot.y>=0&&shot.y<=mapHeight;
  });
}
function updateEnemyRanged(dt,fromX,fromY){
  advanceEnemyShots(dt,fromX,fromY);
  let active=enemyShots.length;
  let candidate=null,profile=null,oldest=Infinity;
  for(const enemy of mobs){
    if(enemy.hp<=0||enemy.stun>0||enemy.knockedBackAt===elapsed){
      if(enemy.aim){enemy.aim=null;enemy.rangedReadyAt=elapsed+.85;}
      continue;
    }
    if(enemy.aim){
      if(elapsed>=enemy.aim.firesAt){
        const aim=enemy.aim;
        enemy.aim=null;
        fireEnemyAttack(enemy,aim);
        if(!aim.profile.seal)active++;
        enemy.rangedReadyAt=elapsed+aim.profile.recovery+Math.random()*.65;
      }else active++;
      continue;
    }
    const readyAt=enemy.rangedReadyAt??0;
    if(elapsed<nextEnemyAimAt||elapsed<readyAt||readyAt>=oldest)continue;
    if(enemy.x<camera.x||enemy.x>camera.x+width||enemy.y<camera.y||enemy.y>camera.y+height)continue;
    const attack=rangedAttacks[enemy.mini?'mini':enemy.kind]??rangedAttacks.shade;
    if(distance(enemy,player)>attack.range)continue;
    candidate=enemy;profile=attack;oldest=readyAt;
  }
  if(!candidate||player.hp<=0||active>=rangedThreatLimit())return;
  const [dx,dy]=unit(player.x-candidate.x,player.y-candidate.y);
  candidate.aim={x:player.x,y:player.y,dx:dx||(!dy?(candidate.facing||1):0),dy,
    profile,firesAt:elapsed+profile.windup};
  if(dx)candidate.facing=Math.sign(dx);
  nextEnemyAimAt=elapsed+(!towerFloor&&time<60?1:.65);
}
function attract(item,dt,radius,speed){
  const gap=distance(item,player);
  if(gap>=radius||gap===0)return;
  const step=Math.min(gap,speed*dt);
  item.x+=(player.x-item.x)*step/gap;
  item.y+=(player.y-item.y)*step/gap;
}
function activateMagnet(){
  const flights=[];
  const stride=Math.max(1,Math.ceil((stars.length+drops.length)/maxMagnetFlights));
  let index=0,visualTime=magnetPulseTime,bombCount=0,bombArrival=0;
  function launch(item,kind){
    const visible=index++%stride===0;
    if(!visible&&kind!=='bomb')return;
    const duration=.35+(magnetFlightTime-.35)*Math.min(distance(item,player)/1200,1);
    if(kind==='bomb'){
      bombCount++;
      bombArrival=Math.max(bombArrival,duration);
    }
    if(!visible)return;
    visualTime=Math.max(visualTime,duration);
    flights.push({x:item.x,y:item.y,kind,startedAt:elapsed,duration});
  }
  for(const star of stars){launch(star,'xp');player.xp+=star.value;}
  for(const drop of drops){launch(drop,drop.kind);if(drop.kind==='heal')heal(.10);}
  stars=[];drops=[];
  // Keep the reward window bounded even when multiple magnets are picked up in quick succession.
  const previous=magnetEffect;
  const bombBursts=previous?.bombBursts??[];
  if(bombCount)bombBursts.push({at:elapsed+bombArrival,count:bombCount});
  magnetEffect={startedAt:elapsed,rewardAt:previous?.rewardAt??elapsed+Math.max(visualTime,bombArrival),bombBursts,
    flights:[...(previous?.flights??[]),...flights].slice(-maxMagnetFlights)};
}
function detonateBombs(count=1){
  const targets=mobs.filter(mob=>mob.hp>0);
  const limit=Math.min(targets.length,bombKillLimit*count);
  // Sample without replacement, then let the regular kill loop handle credits and loot.
  for(let i=0;i<limit;i++){
    const j=i+Math.floor(Math.random()*(targets.length-i));
    const target=targets[j];
    targets[j]=targets[i];
    target.hp=0;
    sparks.push({x:target.x,y:target.y,life:.28,r:8});
  }
  sparks.push({x:player.x,y:player.y,life:bombFlashTime,kind:'bomb'});
}
function updateMagnet(finish=false){
  if(!magnetEffect)return;
  let bombs=0;
  if(magnetEffect.bombBursts.length){
    magnetEffect.bombBursts=magnetEffect.bombBursts.filter(burst=>{
      if(!finish&&elapsed<burst.at)return true;
      bombs+=burst.count;
      return false;
    });
  }
  if(bombs)detonateBombs(bombs);
  if(!magnetEffect.bombBursts.length&&elapsed-magnetEffect.startedAt>=magnetFlightTime)magnetEffect=null;
}
function collectLoot(dt){
  let magnetCollected=false,bombs=0;
  drops=drops.filter(drop=>{
    attract(drop,dt,pickupRadius,240);
    if(distance(drop,player)>=25)return true;
    if(drop.kind==='magnet')magnetCollected=true;
    else if(drop.kind==='heal')heal(.10);
    else if(drop.kind==='bomb')bombs++;
    return false;
  });
  if(bombs)detonateBombs(bombs);
  if(magnetCollected){
    activateMagnet();
    return;
  }
  stars=stars.filter(star=>{
    attract(star,dt,pickupRadius,330);
    if(distance(star,player)>=22)return true;
    player.xp+=star.value;
    return false;
  });
}
function updateIngots(dt,enemies){
  ingots=ingots.filter(ingot=>{
    ingot.life-=dt;
    if(ingot.life<=0)return false;
    if(elapsed<ingot.nextShotAt)return true;
    let target=null,nearest=ingotRange;
    for(const enemy of enemies){
      if(enemy.hp<=0)continue;
      const gap=distance(ingot,enemy);
      if(gap<=nearest){target=enemy;nearest=gap;}
    }
    if(target){
      launchTargetedBolt(ingot,target,ingotShotSpeed,player.brickDamage*ingotShotDamage);
      ingot.nextShotAt+=ingotShotInterval;
    }else ingot.nextShotAt=elapsed+.16;
    return true;
  });
}
function separateEnemies(enemies){
  if(enemies.length<2)return;
  const cellSize=104;
  const columns=Math.ceil(mapWidth/cellSize)+2;
  const grid=new Map();
  for(let index=0;index<enemies.length;index++){
    const enemy=enemies[index];
    if(enemy.hp<=0)continue;
    const col=Math.floor(enemy.x/cellSize);
    const row=Math.floor(enemy.y/cellSize);
    for(let y=row-1;y<=row+1;y++)for(let x=col-1;x<=col+1;x++){
      const neighbors=grid.get((y+1)*columns+x+1);
      if(!neighbors)continue;
      for(const otherIndex of neighbors){
        const other=enemies[otherIndex];
        const dx=enemy.x-other.x;
        const dy=enemy.y-other.y;
        const spacing=(enemy.r+other.r)*.88;
        const distanceSquared=dx*dx+dy*dy;
        if(distanceSquared>=spacing*spacing)continue;
        const gap=Math.sqrt(distanceSquared);
        const angle=(index+otherIndex)*2.399963;
        const nx=gap>0?dx/gap:Math.cos(angle);
        const ny=gap>0?dy/gap:Math.sin(angle);
        const correction=(spacing-gap)*.8;
        const share=other.r**2/(enemy.r**2+other.r**2);
        enemy.x=clamp(enemy.x+nx*correction*share,15,mapWidth-15);
        enemy.y=clamp(enemy.y+ny*correction*share,15,mapHeight-15);
        other.x=clamp(other.x-nx*correction*(1-share),15,mapWidth-15);
        other.y=clamp(other.y-ny*correction*(1-share),15,mapHeight-15);
      }
    }
    const key=(Math.floor(enemy.y/cellSize)+1)*columns+Math.floor(enemy.x/cellSize)+1;
    if(!grid.has(key))grid.set(key,[]);
    grid.get(key).push(index);
  }
}
function update(dt){
  elapsed+=dt;
  if(towerFloor){
    if(!boss){floorTime+=dt;towerTime+=dt;}
  }else if(!boss){
    const stage=bossStages[nextBoss];
    time=Math.min(stage.at,time+dt);
    if(time>=stage.at)startBoss();
  }
  let dx=Number(keys.has('d')||keys.has('arrowright'))-Number(keys.has('a')||keys.has('arrowleft'));
  let dy=Number(keys.has('s')||keys.has('arrowdown'))-Number(keys.has('w')||keys.has('arrowup'));
  if(stick&&Math.hypot(stick.dx,stick.dy)>5){dx=stick.dx;dy=stick.dy;}
  player.moving=Boolean(dx||dy);
  if(player.moving)player.heading=Math.atan2(dy,dx);
  if(dx)player.facing=Math.sign(dx);
  [dx,dy]=unit(dx,dy);
  const fromX=player.x,fromY=player.y;
  const movement=player.speed*(210/baseStats.speed)*dt;
  player.x=clamp(player.x+dx*movement,20,mapWidth-20);
  player.y=clamp(player.y+dy*movement,45,mapHeight-25);
  trackCamera();
  updateSpawns(dt);
  const enemies=boss?[...mobs,boss]:mobs;
  useSkills(dt,enemies);
  const wheelStart=player.wheelAngle,wheelSweep=player.wheelSpeed*dt;
  const hitRadius=wheelHitRadius*(player.evolved[1]?wheelEvolutionScale:1);
  player.wheelAngle=(wheelStart+wheelSweep)%(2*Math.PI);
  trailTimer-=dt;
  if(player.evolved[1]&&trailTimer<=0){
    wheelTrail.push(...wheelPoints().map(wheel=>({...wheel,life:.32})));
    trailTimer=.035;
  }
  wheelTrail=wheelTrail.filter(flame=>(flame.life-=dt)>0);
  updateIngots(dt,enemies);
  player.wheelTimer-=dt;
  for(const enemy of enemies){
    if(enemy.hp<=0)continue;
    enemy.flash-=dt;enemy.stun-=dt;
    if(player.wheels&&elapsed>=(enemy.wheelReadyAt??0)&&wheelSweepsEnemy(enemy,wheelStart,wheelSweep,hitRadius)){
      enemy.wheelReadyAt=elapsed+wheelCooldown;
      damage(enemy,player.wheelDamage);player.wheelTimer=wheelCooldown;
      if(elapsed>=player.attackUntil+.14)poseForAttack(enemy);
      if(player.evolved[1]&&enemy.hp>0&&elapsed>=(enemy.wheelKnockbackReadyAt??0)){
        const [kx,ky]=unit(enemy.x-player.x,enemy.y-player.y);
        const force=enemy.name?24:55;
        enemy.x=clamp(enemy.x+kx*force,15,mapWidth-15);
        enemy.y=clamp(enemy.y+ky*force,15,mapHeight-15);
        enemy.knockedBackAt=elapsed;
        enemy.wheelKnockbackReadyAt=elapsed+wheelKnockbackCooldown;
      }
    }
    if(enemy.hp<=0||enemy.stun>0||enemy.knockedBackAt===elapsed)continue;
    const gap=distance(player,enemy);
    if(enemy.kind==='healer')healEnemyAllies(enemy,enemies);
    const followRange=enemy.kind==='caster'?175:enemy.kind==='healer'?100:enemy.r+12;
    if(gap>followRange&&!enemy.aim){
      const [mx,my]=unit(player.x-enemy.x,player.y-enemy.y);
      enemy.x+=mx*enemy.speed*dt;enemy.y+=my*enemy.speed*dt;
      if(Math.abs(mx)>.08)enemy.facing=Math.sign(mx);
    }
  }
  separateEnemies(enemies);
  // Contact must match the settled positions that the player sees after knockback and separation.
  for(const enemy of enemies){
    if(enemy.hp<=0||enemy.stun>0||enemy.knockedBackAt===elapsed||distance(player,enemy)>enemy.r+16){
      enemy.nextContactHitAt=undefined;
    }else if(elapsed>=(enemy.nextContactHitAt??0)){
      hurt(enemyAttack(enemy),(enemy.name??'怪物')+'撞擊');
      enemy.nextContactHitAt=elapsed+contactHitInterval;
    }
  }
  updateEnemyRanged(dt,fromX,fromY);
  if(boss&&boss.hp>0&&boss.stun<=0){
    boss.cast-=dt;
    if(boss.cast<=0){
      boss.cast=boss.interval*(1-.25*bossPressure());
      const spread=boss.spread??(boss.at===480?3:boss.at===300?2:1);
      for(let i=0;i<spread;i++){
        const offset=(i-(spread-1)/2)*76;
        warnings.push({x:clamp(player.x+offset,20,mapWidth-20),
          y:clamp(player.y+(i%2?52:0),20,mapHeight-20),
          r:boss.at===480?57:48,life:1.25,duration:1.25,damage:enemyAttack(boss),source:boss.name+'的範圍攻擊'});
      }
    }
  }
  warnings=warnings.filter(mark=>{
    mark.life-=dt;
    if(mark.life>0)return true;
    if(distance(mark,player)<mark.r)hurt(mark.damage,mark.source);
    sparks.push({x:mark.x,y:mark.y,life:.32,r:mark.r});
    return false;
  });
  if(player.hp>0){
    updateMagnet();
    collectLoot(dt);
    if(boss?.hp<=0&&(towerFloor||nextBoss===bossStages.length))updateMagnet(true);
  }
  let smallKills=0;
  mobs=mobs.filter(mob=>{
    if(mob.hp>0)return true;
    kills++;
    if(towerFloor)floorKills++;
    if(mob.mini){
      gearRewards++;
      if(Math.random()<miniBossChance)miniBossThreshold+=10;
    }else smallKills++;
    dropLoot(mob,enemyXP(mob));
    return false;
  });
  if(player.hp<=0){finish(false);return;}
  miniBossKills+=smallKills;
  while(miniBossKills>=miniBossThreshold){
    miniBossKills-=miniBossThreshold;
    if((towerFloor||(!boss&&mobs.length<storyMobLimit))&&Math.random()<miniBossChance)addMiniBoss();
  }
  if(boss?.hp<=0){
    kills++;warnings=[];
    const rewardXP=boss.xp??0;
    player.xp+=rewardXP;
    if(towerFloor||nextBoss===bossStages.length){
      const tomeFound=towerFloor>0&&!player.skillTome&&Math.random()<skillTomeChance;
      if(tomeFound)player.skillTome=true;
      boss=null;
      const finishRewards=()=>continueAfterGearRewards(()=>floorCleared(rewardXP,tomeFound));
      if(rewardXP)continueBossLevelUps(finishRewards);
      else finishRewards();
      return;
    }
    sparks.push({x:boss.x,y:boss.y,value:rewardXP,life:bossXPNoticeTime,kind:'boss-xp'});
    dropItem(boss);
    boss=null;
    if(rewardXP&&player.xp>=needed()){
      continueBossLevelUps(continueAfterGearRewards);
      return;
    }
  }
  if(towerFloor&&!boss&&floorKills>=towerGoal)spawnTowerGuardian();
  sparks=sparks.filter(s=>(s.life-=dt)>0);
  if(showGearReward())return;
  if(elapsed<nextRewardAt||(magnetEffect&&elapsed<magnetEffect.rewardAt))return;
  if(advanceLevel())showUpgrades();
}
function circle(x,y,r,fill,stroke,line=2){

function starShape(x,y,r,color){

      const x=col*tileWidth,y=row*32,seed=(row*17+col*13)%19;
      const lane=Math.abs(x-mapWidth/2)<150||Math.abs(y-mapHeight/2)<104;
      block((lane?stone:tiles)[seed%3],x,y,46,30);
      block(lane?'#83918a':'#597378',x,y,46,2);
      block('#30464b',x+2,y+28,42,2);
      if(seed<4){block('#334e53',x+14,y+8,10,2);block('#334e53',x+22,y+10,2,6);}
      if(seed>15){block('#395756',x+6,y+20,8,6);block('#5c7770',x+8,y+18,4,2);}
    }
  }
  ctx.strokeStyle='#aa8054';ctx.lineWidth=6;ctx.strokeRect(8,8,mapWidth-16,mapHeight-16);
  const flame=Math.floor(elapsed*5)%2;
  for(let x=240;x<mapWidth;x+=480)for(let y=210;y<mapHeight;y+=420){
    if(x<camera.x-110||x>camera.x+width+110||y<camera.y-110||y>camera.y+height+110)continue;
    block('#31484d',x-47,y-39,94,82);block('#9a805b',x-45,y-37,90,78);
    block('#657771',x-40,y-32,80,68);block('#87918a',x-34,y-26,68,56);
    block('#6a6c58',x-4,y-20,8,40);block('#6a6c58',x-20,y-4,40,8);
    block('#b79a68',x-9,y-9,18,18);block('#7a5d4c',x-4,y-4,8,8);
    for(const offset of [-55,55]){
      const cx=x+offset;
      block('#25363c',cx-8,y-5,16,9);block('#32292a',cx-3,y-34,6,34);
      block('#a9473c',cx-9,y-31,18,20);block('#e9834f',cx-7,y-32,14,18);
      block(flame?'#ffe0a2':'#ffc474',cx-3,y-29,6,12);
      block('#ffc66b',cx-6,y-35,12,3);block('#ffc66b',cx-6,y-14,12,3);
      block('#a9473c',cx-1,y-11,2,5);
    }
  }
}
function paintEnemy(target,kind,frame,color){
  const p=(ink,x,y,w,h)=>pixel(target,ink,x,y,w,h);
  const dark='#202b32',gold='#ffd079',white='#f5efd6';
  if(kind==='dragon'){
    p(dark,1,12,22,9);p(dark,3,7,18,15);p(dark,5,2,4,11);p(dark,15,2,4,11);
    p(gold,6,3,2,7);p(gold,16,3,2,7);p(color,4,9,16,10);p(color,2,13,20,6);
    p('#6c5148',7,19,10,3);p(gold,8,17,8,3);p(dark,10,18,1,1);p(dark,13,18,1,1);
    p(white,6,12,4,3);p(white,14,12,4,3);p(dark,8,12,2,3);p(dark,14,12,2,3);
    p('#e87749',10,8,4,2);p(gold,2,19+frame,4,2);p(gold,18,19-frame,4,2);
    return;
  }
  p(dark,5,3,14,3);p(dark,3,6,18,14);p(dark,2,15,20,5);
  p(color,6,5,12,2);p(color,4,7,16,12);
  p(color,4,18,4,2+frame);p(color,10,18,4,3-frame);p(color,16,18,4,2+frame);
  p(dark,7,10,3,4);p(dark,14,10,3,4);p(white,7,10,1,1);p(white,14,10,1,1);p(dark,10,15,4,1);
  if(kind==='runner'){
    p(dark,0,9,5,3);p(gold,0,9,4,1);p(dark,19,8,5,3);p(gold,20,9,4,1);
  }
  if(kind==='guard'){
    p('#475b68',5,6,14,3);p('#a1b9bc',6,6,12,1);
    p(dark,15,12,7,9);p('#8eafb5',16,13,5,7);p(gold,18,15,1,3);
  }
  if(kind==='healer'){
    p('#527a63',4,5,16,3);p(white,11,5,2,6);p(white,9,7,6,2);
  }
  if(kind==='caster'){
    p(dark,8,1,8,5);p('#7a61a2',10,1,4,5);p(gold,11,4,2,2);
    p(dark,19,7,2,13);p(gold,18,5,4,4);
  }
  if(kind==='mini'||kind==='boss'){
    p(dark,3,2,3,5);p(dark,18,2,3,5);p(gold,4,2,2,4);p(gold,18,2,2,4);
    p(white,8,16,2,2);p(white,14,16,2,2);
  }
}
const enemyColors={shade:'#e1ded0',runner:'#f09273',guard:'#718d9f',healer:'#82cb9f',caster:'#af9fdb'};
function ghost(enemy){
  const kind=enemy===boss?(enemy.at===480||enemy.spread?'dragon':'boss'):enemy.mini?'mini':enemy.kind??'shade';
  const casting=Boolean(enemy.aim)||(enemy===boss&&enemy.cast<.28);
  const frame=casting?1:Math.floor(elapsed*7+(enemy.phase??0))%2;
  const y=Math.round(enemy.y)+(enemy.stun>0?0:frame*3);
  const color=enemy.flash>0?'#fff4bd':enemy.color??enemyColors[kind];
  const pic=sprite(kind+':'+color+':'+frame,24,24,layer=>paintEnemy(layer,kind,frame,color));
  const scale=enemy===boss?4:enemy.mini?2.5:kind==='guard'?1.85:1.55;
  pixel(ctx,'#20313688',Math.round(enemy.x-enemy.r/2),Math.round(y),enemy.r,5);
  drawActorSprite(pic,enemy.x,y+enemy.r*.68,scale,enemy.facing<0);
  if(casting){
    pixel(ctx,'#f18b54',enemy.x-4,y-enemy.r-14,8,8);
    pixel(ctx,'#ffe69a',enemy.x-2,y-enemy.r-16,4,12);
  }
  if(enemy.healFlashUntil>elapsed||enemy.stun>0){
    const ink=enemy.stun>0?'#ffd879':'#94ebac';
    pixel(ctx,ink,enemy.x-2,y-enemy.r-17,4,10);
    pixel(ctx,ink,enemy.x-5,y-enemy.r-14,10,4);
  }
  if(enemy.mini){
    ctx.font='bold 13px system-ui';ctx.textAlign='center';ctx.textBaseline='bottom';
    ctx.fillStyle='#fff1db';ctx.fillText(enemy.name,enemy.x,y-enemy.r-15);
  }
  if(enemy!==boss&&enemy.hp<enemy.maxHp){
    pixel(ctx,'#283237',enemy.x-enemy.r,y-enemy.r-9,enemy.r*2,4);
    pixel(ctx,'#f09c7e',enemy.x-enemy.r,y-enemy.r-9,enemy.r*2*Math.max(0,enemy.hp/enemy.maxHp),4);
  }
}
function drawIngot(x,y){
  ctx.beginPath();ctx.moveTo(x-18,y-7);
  ctx.quadraticCurveTo(x,y+1,x+18,y-7);
  ctx.quadraticCurveTo(x+15,y+13,x,y+11);
  ctx.quadraticCurveTo(x-15,y+13,x-18,y-7);
  ctx.fillStyle='#ffc64c';ctx.fill();
  ctx.lineWidth=2;ctx.strokeStyle='#754344';ctx.stroke();
  circle(x,y-3,7,'#ffe899','#a36646',1.5);
}
function drawXpGem(x,y){
  pixel(ctx,'#625450',x-5,y-3,10,7);
  pixel(ctx,'#ffcb65',x-3,y-5,6,10);
  pixel(ctx,'#ffe5a0',x-1,y-4,2,5);
}
function drawLootDrop(x,y,kind){
  if(kind==='bomb'){
    circle(x,y,13,'#b45745','#382b39',3);
    circle(x,y+1,6,'#29343f','#ffe0a1',1.5);
    pixel(ctx,'#ffd47b',x+3,y-8,2,4);pixel(ctx,'#fff0aa',x+5,y-10,3,3);
    return;
  }
  const isHeal=kind==='heal';
  circle(x,y,13,isHeal?'#ef6d91':'#71d8ff','#3c2a54',3);
  ctx.fillStyle='#251637';ctx.font='bold 15px system-ui';
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(isHeal?'+':'磁',x,y);
}
function drawMagnetPull(){
  if(!magnetEffect)return;
  const age=elapsed-magnetEffect.startedAt;
  ctx.save();
  for(const delay of [0,.12]){
    const t=(age-delay)/(magnetPulseTime-delay);
    if(t<0||t>=1)continue;
    ctx.globalAlpha=(1-t)*.85;
    circle(player.x,player.y,24+142*t,null,'#71d8ff',4-2*t);
  }
  for(const item of magnetEffect.flights){
    const t=(elapsed-item.startedAt)/item.duration;
    if(t>=1)continue;
    const remaining=(1-t)**2;
    const dx=item.x-player.x,dy=item.y-player.y;
    const x=player.x+dx*remaining,y=player.y+dy*remaining;
    if(x<camera.x-24||x>camera.x+width+24||y<camera.y-24||y>camera.y+height+24)continue;
    const tail=(1-Math.max(0,t-.075))**2;
    ctx.globalAlpha=(1-t*.55)*.75;
    ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(player.x+dx*tail,player.y+dy*tail);
    ctx.strokeStyle=item.kind==='xp'?'#ffdc88':item.kind==='heal'?'#ff97b0':item.kind==='bomb'?'#ffae68':'#71d8ff';
    ctx.lineWidth=item.kind==='xp'?3:5;ctx.stroke();
    ctx.globalAlpha=1-t*.55;
    if(item.kind==='xp')drawXpGem(x,y);
    else drawLootDrop(x,y,item.kind);
  }
  ctx.restore();
}
function drawTargetedBolt(bolt){
  ctx.save();ctx.translate(bolt.x,bolt.y);ctx.rotate(bolt.angle);
  if(bolt.basePower!==null){
    pixel(ctx,'#ffd16890',-17,-2,15,4);
    circle(0,0,6,'#ffc354','#754637',2);
    pixel(ctx,'#fff3b4',-2,-2,4,4);
    ctx.restore();return;
  }
  pixel(ctx,'#77e9bc78',-24,-2,18,4);
  ctx.beginPath();ctx.moveTo(-7,-12);ctx.quadraticCurveTo(28,0,-7,12);
  ctx.quadraticCurveTo(12,0,-7,-12);ctx.closePath();
  ctx.fillStyle='#7af0c4';ctx.fill();ctx.strokeStyle='#236776';ctx.lineWidth=2;ctx.stroke();
  pixel(ctx,'#e9fff2',7,-2,7,4);
  ctx.restore();
}
function drawGroundWarning(x,y,r,charge,seal=false){
  circle(x,y,r,'#ec655647','#ffb082',2);
  if(charge>0)circle(x,y,r*Math.sqrt(charge),'#ff885b55');
  if(seal){
    pixel(ctx,'#ffd18b',x-2,y-8,4,16);
    pixel(ctx,'#ffd18b',x-8,y-2,16,4);
  }
}
function drawEnemyAim(enemy){
  const aim=enemy.aim;
  const {profile}=aim;
  const charge=clamp(1-(aim.firesAt-elapsed)/profile.windup,0,1);
  if(profile.seal){drawGroundWarning(aim.x,aim.y,profile.radius,charge,true);return;}
  const reach=profile.range+24+Math.min(12,enemy.r);
  ctx.save();ctx.globalAlpha=.55+.4*charge;ctx.strokeStyle='#ffb38e';ctx.lineWidth=2;
  ctx.setLineDash([8,6]);
  ctx.beginPath();ctx.moveTo(enemy.x,enemy.y);
  ctx.lineTo(enemy.x+aim.dx*reach,enemy.y+aim.dy*reach);ctx.stroke();
  ctx.restore();
}
function drawEnemyShot(shot){
  const tail=shot.radius*2;
  circle(shot.x-shot.dx*tail,shot.y-shot.dy*tail,shot.radius*.65,'#ec6640ab');
  circle(shot.x,shot.y,shot.radius,'#ff8e66','#4d2d31',2);
  circle(shot.x,shot.y,shot.radius*.46,'#fff2bb');
}
function draw(){
  ctx.save();ctx.translate(-camera.x,-camera.y);
  background();
  for(const mark of warnings){
    const charge=clamp(1-mark.life/mark.duration,0,1);
    drawGroundWarning(mark.x,mark.y,mark.r,charge);
  }
  for(const mob of mobs)if(mob.aim)drawEnemyAim(mob);
  for(const star of stars)drawXpGem(star.x,star.y);
  for(const drop of drops)drawLootDrop(drop.x,drop.y,drop.kind);
  for(const ingot of ingots){
    circle(ingot.x,ingot.y,22,'#ffe59225','#ffdb7a90',2);
    drawIngot(ingot.x,ingot.y);
  }
  for(const mob of mobs){
    if(mob.x<camera.x-65||mob.x>camera.x+width+65||mob.y<camera.y-65||mob.y>camera.y+height+65)continue;
    ghost(mob);
  }
  if(boss)ghost(boss);
  for(const bolt of targetedBolts)drawTargetedBolt(bolt);
  for(const shot of shots)if(shot.lag<=0){
    if(shot.fire){
      for(let i=4;i>0;i--){
        circle(shot.x-Math.cos(shot.angle)*i*5,shot.y-Math.sin(shot.angle)*i*5,12-i*1.8,'#fc6d4b');
      }
      circle(shot.x,shot.y,9,'#fff097','#ff9739',4);
      continue;
    }
    circle(shot.x,shot.y,11,null,'#713e4b',7);
    circle(shot.x,shot.y,11,null,'#ffd65e',4);
    starShape(shot.x+8,shot.y-8,5,'#fff0ac');
  }
  const wheelScale=player.evolved[1]?wheelEvolutionScale:1;
  for(const flame of wheelTrail){
    ctx.globalAlpha=flame.life/.32;
    circle(flame.x,flame.y,(5+flame.life*26)*wheelScale,'#ff7034');
    circle(flame.x,flame.y,(3+flame.life*14)*wheelScale,'#ffe477');
  }
  ctx.globalAlpha=1;
  for(const wheel of wheelPoints()){
    circle(wheel.x,wheel.y,22*wheelScale,'#ff6f4d','#71354d',3);
    circle(wheel.x,wheel.y,10*wheelScale,null,'#ffd575',4);
    starShape(wheel.x,wheel.y,7*wheelScale,'#fff3b7');
  }
  for(const brick of bricks){
    const t=clamp(1-brick.left/.44,0,1);
    const x=brick.fromX+(brick.x-brick.fromX)*t;
    const y=brick.fromY+(brick.y-brick.fromY)*t-Math.sin(t*Math.PI)*55;
    if(brick.ingot){drawIngot(x,y);continue;}
    ctx.fillStyle='#ffd169';ctx.strokeStyle='#8f5550';ctx.lineWidth=3;
    ctx.fillRect(x-12,y-8,24,14);ctx.strokeRect(x-12,y-8,24,14);
  }
  drawMagnetPull();
  for(const shot of enemyShots)drawEnemyShot(shot);
  const {x,y}=player;
  pixel(ctx,'#18292e88',Math.round(x)-12,Math.round(y)+3,24,7);
  const flying=player.moving&&mode==='play';
  const attacking=player.attackUntil>elapsed;
  if(heroSheet.naturalWidth){
    const pose=attacking?'attack':flying?'fly':'idle';
    const hover=attacking?0:Math.round(Math.sin(elapsed*(flying?15:5))*(flying?3:1));
    drawHero(ctx,pose,x,y+7+hover,78,attacking?player.attackFacing:player.facing);
  }
  for(const spark of sparks){
    if(spark.kind==='boss-xp'){
      ctx.save();ctx.globalAlpha=Math.min(1,spark.life*2);
      ctx.textAlign='center';ctx.textBaseline='bottom';ctx.font='bold 20px system-ui';
      ctx.lineWidth=4;ctx.strokeStyle='#24323c';ctx.fillStyle='#ffdc88';
      const y=spark.y-30-(bossXPNoticeTime-spark.life)*26;
      const label='+'+spark.value+' XP';
      ctx.strokeText(label,spark.x,y);ctx.fillText(label,spark.x,y);ctx.restore();
    }else if(spark.kind==='ring-burst'){
      const fade=spark.life/ringExplosionLife;
      ctx.save();ctx.globalAlpha=fade;
      circle(spark.x,spark.y,spark.r,'#f57a4d22','#ffe19a',2);
      starShape(spark.x,spark.y,Math.min(28,spark.r*.52)*(1+(1-fade)*.25),'#ffb96f');
      ctx.restore();
    }else if(spark.kind==='bomb'){
      const fade=spark.life/bombFlashTime;
      ctx.save();ctx.globalAlpha=fade;
      starShape(spark.x,spark.y-6,16+23*(1-fade),'#ffb563');
      starShape(spark.x,spark.y-6,7+10*(1-fade),'#fff0a3');
      ctx.restore();
    }else if(spark.r>10)circle(spark.x,spark.y,spark.r,null,'#ffdb8ba8',3);
    else starShape(spark.x,spark.y,8+spark.life*35,'#fff1bf');
  }
  ctx.restore();
  if(stick){
    const size=Math.hypot(stick.dx,stick.dy),[sx,sy]=unit(stick.dx,stick.dy);
    circle(stick.x,stick.y,34,'#38244a66','#fff4db99');
    circle(stick.x+sx*Math.min(size,25),stick.y+sy*Math.min(size,25),13,'#ffd88ed9');
  }
}
const health=document.querySelector('#health');
const attack=document.querySelector('#attack');
const defense=document.querySelector('#defense');
const moveSpeed=document.querySelector('#moveSpeed');
const waveHud=document.querySelector('#wave');
const clock=document.querySelector('#clock');
const level=document.querySelector('#level');
const score=document.querySelector('#score');
const xp=document.querySelector('#xp');
const bossbar=document.querySelector('#bossbar');
const bossname=document.querySelector('#bossname');
const bossHP=document.querySelector('#bossHP');
const [qiSlot,...skillSlots]=[...document.querySelectorAll('.skill')].map(slot=>({
  name:slot.querySelector('strong'),status:slot.querySelector('small'),bar:slot.querySelector('progress')
}));
const gear=document.querySelector('#gear');
function drawWaveHud(){
  let message='',warning=false;
  if(towerFloor){
    message=boss?'守關魔王出現':'本層擊退 '+Math.min(floorKills,towerGoal)+' / '+towerGoal;
  }else if(!boss){
    const wave=storyWaves[nextWave];
    if(wave){
      const untilWave=wave.at-time;
      if(untilWave>0&&untilWave<=waveWarningTime){
        warning=true;
        message='怪潮預警・'+Math.ceil(untilWave)+' 秒';
      }else if(untilWave<=0){
        message=wave.name+'・'+Math.ceil(wave.duration+untilWave)+' 秒';
      }
    }
  }
  waveHud.hidden=!message;
  waveHud.classList.toggle('wave-warning',warning);
  if(waveHud.textContent!==message)waveHud.textContent=message;
}
function drawSkillHud(){
  const qi=player.qi;
  qiSlot.name.textContent='氣功普攻';
  qiSlot.status.textContent='強化 '+qi.rank+' · '+qi.timer.toFixed(2)+' 秒';
  qiSlot.bar.value=clamp(1-qi.timer/qi.cooldown,0,1);
  const limits=[ringCooldown,wheelCooldown,brickCooldown];
  const cooldowns=[player.ringTimer,player.wheelTimer,player.brickTimer];
  const openSlot=hasFreeSkillSlot();
  skillSlots.forEach(({name,status,bar},index)=>{
    const level=player.skillLevels[index];
    const cooldown=Math.max(0,cooldowns[index]);
    const title=player.evolved[index]?evolvedNames[index]:skillNames[index];
    name.textContent=(index+1)+' '+title;
    status.textContent=level?'Lv.'+level+' · '+'CD '+cooldown.toFixed(1)+' 秒':openSlot?'尚未解鎖':'需絕世寶典';
    bar.value=level?clamp(1-cooldown/limits[index],0,1):0;
  });
  gear.textContent=gearNames.map((name,index)=>name+' Lv.'+player.gear[index]).join('　');
}
let previous=0;
function frame(now){
  const dt=Math.min(.035,(now-previous)/1000);
  previous=now;
  if(mode==='play')update(dt);
  draw();
  drawSkillHud();
  health.textContent=Math.ceil(player.hp)+'/'+player.maxHp;
  attack.textContent=Math.round(player.attack*100)/100;
  defense.textContent=Math.round(player.defense*100)/100;
  moveSpeed.textContent=player.speed+'/'+maxMoveSpeed;
  drawWaveHud();
  clock.textContent=towerFloor?'無限塔 '+towerFloor+' 層':formatTime(time)+(boss?' 暫停':' / '+formatTime(rounds));
  bossbar.hidden=!boss;
  if(boss){
    const pressure=bossPressure();
    bossname.textContent=boss.name+(pressure>0?' · 強化 '+Math.round(pressure*100)+'%':'');
    bossHP.max=boss.maxHp;bossHP.value=Math.max(0,boss.hp);
  }
  level.textContent='等級 '+player.level;
  const requiredXP=needed();
  score.textContent='擊退 '+kills+' · XP '+player.xp+'/'+requiredXP;
  xp.max=requiredXP;xp.value=player.xp;
  requestAnimationFrame(frame);
}
resize();reset();showStart();
heroSheet.src=heroSheetUrl;
accountRequest('session').then(({nickname})=>{
  if(!nickname){location.replace('/games/nezha');return;}
  const nicknameLabel=document.querySelector('#nickname');
  nicknameLabel.textContent=nickname;
  nicknameLabel.title=nickname;
}).catch(()=>{location.replace('/games/nezha');});
document.querySelector('#logout').onclick=async()=>{
  try{await accountRequest('logout',{});location.replace('/games/nezha');}
  catch(error){window.alert(error.message);}
};
new ResizeObserver(()=>{resize();trackCamera();}).observe(canvas);
requestAnimationFrame(frame);
</script>
